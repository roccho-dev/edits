name: bounded vim nix herdr oci proof runner

on:
  push:
    branches:
      - proposals
    paths:
      - "proofs/vim-nix/requests/current.json"
  workflow_run:
    workflows:
      - "Proof pinned Vim Nix Herdr HQ OCI handoff"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bounded-vim-nix-herdr-oci-proof
  cancel-in-progress: false

jobs:
  snapshot-heads:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.id == 32437204492
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout control revision
        uses: actions/checkout@v4
        with:
          ref: proposals
          fetch-depth: 0
          persist-credentials: false

      - id: request
        name: Read exact selected candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          request = json.loads(pathlib.Path('proofs/vim-nix/requests/current.json').read_text(encoding='utf-8'))
          if request.get('schema') != 'edits.vimNixOciProofRequest/1':
              raise SystemExit('unsupported request schema')
          commit = request.get('commit', '')
          tree = request.get('tree', '')
          ref = request.get('ref', '')
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('commit must be exact 40-hex')
          if not re.fullmatch(r'[0-9a-f]{40}', tree):
              raise SystemExit('tree must be exact 40-hex')
          if ref != 'refs/heads/proof/vim-nix-herdr-oci-current-20260821':
              raise SystemExit('request ref outside bounded branch')
          with open(sys.argv[1], 'a', encoding='utf-8') as out:
              print(f'commit={commit}', file=out)
              print(f'tree={tree}', file=out)
              print(f'ref={ref}', file=out)
          PY

      - name: Materialize every related head
        shell: bash
        env:
          SELECTED_COMMIT: ${{ steps.request.outputs.commit }}
          SELECTED_TREE: ${{ steps.request.outputs.tree }}
          SELECTED_REF: ${{ steps.request.outputs.ref }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/edits-vim-nix-related-heads"
          rm -rf "$out"
          mkdir -p "$out/heads"

          branches=(
            proposals
            proof/vim-nix-herdr-oci-20260821
            proof/vim-nix-herdr-oci-current-20260821
            proof/vim-nix-herdr-oci-exec-e5ff3770
            proof/vim-nix-herdr-oci-runner-base-20260821
            proposal/bounded-vim-nix-oci-runner-20260821
            proposal/fix-bounded-vim-nix-oci-runner-20260821
            proposal/hq-vim-oci-proof-job-20260821
            proposal/push-vim-nix-oci-runner-20260821
          )

          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          selected_remote="refs/remotes/origin/${SELECTED_REF#refs/heads/}"
          test "$(git rev-parse "$selected_remote^{commit}")" = "$SELECTED_COMMIT"
          test "$(git rev-parse "$SELECTED_COMMIT^{tree}")" = "$SELECTED_TREE"

          refs=()
          : > "$out/HEADS.tsv"
          for branch in "${branches[@]}"; do
            remote="refs/remotes/origin/$branch"
            git show-ref --verify --quiet "$remote"
            sha=$(git rev-parse "$remote^{commit}")
            tree=$(git rev-parse "$sha^{tree}")
            safe=${branch//\//__}
            local_ref="refs/heads/materialized/$safe"
            git update-ref "$local_ref" "$sha"
            refs+=("$local_ref")
            printf '%s\t%s\t%s\n' "$branch" "$sha" "$tree" >> "$out/HEADS.tsv"
            git archive --format=tar --prefix="edits-$safe/" "$sha" | gzip -n > "$out/heads/$safe.tar.gz"
          done

          git bundle create "$out/edits-vim-nix-related-heads.git.bundle" "${refs[@]}"
          git bundle verify "$out/edits-vim-nix-related-heads.git.bundle" > "$out/bundle-verify.txt"

          python3 - "$out" "$SELECTED_COMMIT" "$SELECTED_TREE" "${branches[@]}" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          out = pathlib.Path(sys.argv[1])
          selected_commit = sys.argv[2]
          selected_tree = sys.argv[3]
          branches = sys.argv[4:]
          rows = []
          for branch in branches:
              ref = f"refs/remotes/origin/{branch}"
              sha = subprocess.check_output(['git', 'rev-parse', f'{ref}^{{commit}}'], text=True).strip()
              tree = subprocess.check_output(['git', 'rev-parse', f'{sha}^{{tree}}'], text=True).strip()
              parent_line = subprocess.check_output(['git', 'rev-list', '--parents', '-n', '1', sha], text=True).strip().split()
              merge_base = subprocess.check_output(['git', 'merge-base', sha, 'refs/remotes/origin/proposals'], text=True).strip()
              changed = subprocess.check_output(['git', 'diff', '--name-status', merge_base, sha], text=True).splitlines()
              safe = branch.replace('/', '__')
              archive = out / 'heads' / f'{safe}.tar.gz'
              rows.append({
                  'branch': branch,
                  'commit': sha,
                  'tree': tree,
                  'parents': parent_line[1:],
                  'mergeBaseWithProposals': merge_base,
                  'changedPaths': changed,
                  'archive': archive.name,
                  'archiveBytes': archive.stat().st_size,
                  'archiveSha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              })
          manifest = {
              'schema': 'edits.vimNixRelatedHeadsSnapshot/1',
              'repository': 'roccho-dev/edits',
              'status': 'PASS',
              'selected': {'commit': selected_commit, 'tree': selected_tree},
              'heads': rows,
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"
          (cd "$out" && sha256sum --check SHA256SUMS)

      - name: Upload exact related-head snapshot
        uses: actions/upload-artifact@v4
        with:
          name: edits-vim-nix-related-heads-${{ steps.request.outputs.commit }}
          path: ${{ runner.temp }}/edits-vim-nix-related-heads
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  proof:
    needs: snapshot-heads
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARTIFACT: ${{ runner.temp }}/vim-nix-herdr-oci-proof
      IMAGE_REF: roccho/vim-nix-herdr-hq-proof:d83bf4c
      OCI_IMAGE_REF: roccho/vim-nix-herdr-hq-proof:oci-d83bf4c
    steps:
      - name: Checkout control revision
        uses: actions/checkout@v4
        with:
          ref: proposals
          fetch-depth: 1
          persist-credentials: false

      - id: request
        name: Read exact selected candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          request = json.loads(pathlib.Path('proofs/vim-nix/requests/current.json').read_text(encoding='utf-8'))
          commit = request['commit']; tree = request['tree']; ref = request['ref']
          if request.get('schema') != 'edits.vimNixOciProofRequest/1': raise SystemExit('unsupported schema')
          if not re.fullmatch(r'[0-9a-f]{40}', commit): raise SystemExit('invalid commit')
          if not re.fullmatch(r'[0-9a-f]{40}', tree): raise SystemExit('invalid tree')
          if ref != 'refs/heads/proof/vim-nix-herdr-oci-current-20260821': raise SystemExit('invalid ref')
          with open(sys.argv[1], 'a', encoding='utf-8') as out:
              print(f'commit={commit}', file=out); print(f'tree={tree}', file=out); print(f'ref={ref}', file=out)
          PY

      - name: Checkout exact selected candidate
        shell: bash
        env:
          SELECTED_COMMIT: ${{ steps.request.outputs.commit }}
          SELECTED_TREE: ${{ steps.request.outputs.tree }}
          SELECTED_REF: ${{ steps.request.outputs.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SELECTED_REF"
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$SELECTED_COMMIT"
          git checkout --detach "$SELECTED_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SELECTED_TREE"
          test -z "$(git status --porcelain=v1)"

      - name: Announce exact run to Issue 74
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 74,
              body: [
                '## Exact-head OCI / WSLC materialization run started',
                '',
                `workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `selected commit: \`${{ steps.request.outputs.commit }}\``,
                `selected tree: \`${{ steps.request.outputs.tree }}\``
              ].join('\n')
            });

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Execute complete materialization and runtime proof
        shell: bash
        run: |
          set -euo pipefail
          cat proofs/vim-nix/ci.parts/*.sh > "$RUNNER_TEMP/vim-nix-proof-ci.sh"
          chmod 0700 "$RUNNER_TEMP/vim-nix-proof-ci.sh"
          "$RUNNER_TEMP/vim-nix-proof-ci.sh"

      - name: Preserve exact source even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT/source"
          git bundle create "$ARTIFACT/source/edits-vim-nix-herdr-oci.git.bundle" HEAD
          python3 - <<'PY'
          import pathlib, zipfile
          out = pathlib.Path(__import__('os').environ['ARTIFACT']) / 'source' / 'edits-vim-nix-herdr-oci.source.zip'
          paths = [pathlib.Path('proofs/vim-nix'), pathlib.Path('.github/workflows/proof-vim-nix-oci.yml')]
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path in paths:
                  if path.is_dir():
                      for f in sorted(path.rglob('*')):
                          if f.is_file(): z.write(f, f.as_posix())
                  elif path.is_file(): z.write(path, path.as_posix())
          PY
          git status --porcelain=v1 > "$ARTIFACT/source/git-status.txt"

      - name: Upload OCI, WSLC, evidence, and exact source pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vim-nix-herdr-hq-oci-wslc-${{ steps.request.outputs.commit }}
          path: ${{ runner.temp }}/vim-nix-herdr-oci-proof
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Report result to Issue 74
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 74,
              body: [
                '## Exact-head OCI / WSLC materialization run',
                '',
                `status: \`${ok ? 'success' : 'failure'}\``,
                `workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `selected commit: \`${{ steps.request.outputs.commit }}\``,
                `selected tree: \`${{ steps.request.outputs.tree }}\``,
                '',
                ok
                  ? 'The exact Nix/offline, Herdr PTY/Vim/HQ/worker, Docker, OCI, mutation, parity, and WSLC projection proof passed.'
                  : 'The run failed closed. Exact source and partial evidence were uploaded; no completion claim is made.'
              ].join('\n')
            });
