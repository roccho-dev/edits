name: bounded vim nix herdr oci proof runner

on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [proposals]
    types: [opened, reopened, synchronize]
  push:
    branches: [proposals]
    paths:
      - "proofs/vim-nix/requests/current.json"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bounded-vim-nix-herdr-oci-proof
  cancel-in-progress: false

jobs:
  proof:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'proof/vim-nix-herdr-oci-current-20260821') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 74 &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/run-vim-nix-oci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ARTIFACT: ${{ runner.temp }}/vim-nix-herdr-oci-proof
    steps:
      - name: Checkout control revision
        uses: actions/checkout@v4
        with:
          ref: proposals
          fetch-depth: 1
          persist-credentials: false

      - id: request
        name: Read exact selected candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          request = json.loads(pathlib.Path('proofs/vim-nix/requests/current.json').read_text(encoding='utf-8'))
          commit = request['commit']; tree = request['tree']; ref = request['ref']
          if request.get('schema') != 'edits.vimNixOciProofRequest/1': raise SystemExit('unsupported schema')
          if not re.fullmatch(r'[0-9a-f]{40}', commit): raise SystemExit('invalid commit')
          if not re.fullmatch(r'[0-9a-f]{40}', tree): raise SystemExit('invalid tree')
          if ref != 'refs/heads/proof/vim-nix-herdr-oci-current-20260821': raise SystemExit('invalid ref')
          with open(sys.argv[1], 'a', encoding='utf-8') as out:
              print(f'commit={commit}', file=out)
              print(f'tree={tree}', file=out)
              print(f'ref={ref}', file=out)
          PY

      - name: Checkout exact selected candidate
        shell: bash
        env:
          SELECTED_COMMIT: ${{ steps.request.outputs.commit }}
          SELECTED_TREE: ${{ steps.request.outputs.tree }}
          SELECTED_REF: ${{ steps.request.outputs.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SELECTED_REF"
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$SELECTED_COMMIT"
          git checkout --detach "$SELECTED_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SELECTED_TREE"
          test -z "$(git status --porcelain=v1)"

      - name: Announce exact run to Issue 74
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 74,
              body: [
                '## Strict v25 distribution closure run started',
                '',
                `workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `selected commit: \`${{ steps.request.outputs.commit }}\``,
                `selected tree: \`${{ steps.request.outputs.tree }}\``
              ].join('\n')
            });

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Execute strict distribution proof
        shell: bash
        run: |
          set -euo pipefail
          cat proofs/vim-nix/ci.parts/*.sh > "$RUNNER_TEMP/vim-nix-proof-ci.sh"
          chmod 0700 "$RUNNER_TEMP/vim-nix-proof-ci.sh"
          "$RUNNER_TEMP/vim-nix-proof-ci.sh"

      - name: Preserve exact source even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT/source"
          git rev-parse HEAD > "$ARTIFACT/source/commit.txt"
          git rev-parse HEAD^{tree} > "$ARTIFACT/source/tree.txt"
          git status --porcelain=v1 > "$ARTIFACT/source/git-status.txt"
          git bundle create "$ARTIFACT/source/edits-vim-nix-herdr-oci.git.bundle" HEAD
          git bundle verify "$ARTIFACT/source/edits-vim-nix-herdr-oci.git.bundle" > "$ARTIFACT/source/bundle-verify.txt"
          python3 - <<'PY'
          import pathlib, zipfile, os
          out = pathlib.Path(os.environ['ARTIFACT']) / 'source' / 'edits-vim-nix-herdr-oci.source.zip'
          paths = [pathlib.Path('proofs/vim-nix'), pathlib.Path('.github/workflows/bounded-vim-nix-oci-proof.yml')]
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for path in paths:
                  if path.is_dir():
                      for f in sorted(path.rglob('*')):
                          if f.is_file(): z.write(f, f.as_posix())
                  elif path.is_file():
                      z.write(path, path.as_posix())
          PY
          find "$ARTIFACT" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$ARTIFACT/SHA256SUMS"

      - name: Upload strict proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vim-nix-strict-v25-${{ steps.request.outputs.commit }}
          path: ${{ runner.temp }}/vim-nix-herdr-oci-proof
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Report strict result to Issue 74
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 74,
              body: [
                '## Strict v25 distribution closure run',
                '',
                `status: \`${ok ? 'success' : 'failure'}\``,
                `workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `selected commit: \`${{ steps.request.outputs.commit }}\``,
                `selected tree: \`${{ steps.request.outputs.tree }}\``,
                '',
                ok
                  ? '`DISTRIBUTION_CLOSURE_PASS`: N3, D1-D3, O1-O3, X1, X2 are Green. `WINDOWS_WSLC_PHYSICAL` remains OPEN until independent physical readback.'
                  : 'Failed closed. Partial evidence was uploaded; no distribution or completion PASS is claimed.'
              ].join('\n')
            });
