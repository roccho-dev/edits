name: build and release edits candidate OCI

"on":
  pull_request:
    branches:
      - proposals
    paths:
      - ".github/workflows/candidate-oci-release.yml"
      - "cmd/edits-client/**"
      - "cmd/edits-service/**"
      - "cmd/edits-mux/**"
      - "packages/hq-vim/**"
      - "proofs/issue-118/wt05a-ci-release/**"
      - "proofs/vim-nix/**"
  push:
    branches:
      - proposals
    paths:
      - ".github/workflows/candidate-oci-release.yml"
      - "cmd/edits-client/**"
      - "cmd/edits-service/**"
      - "cmd/edits-mux/**"
      - "packages/hq-vim/**"
      - "proofs/issue-118/wt05a-ci-release/**"
      - "proofs/vim-nix/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create the exact-commit candidate prerelease after every gate passes
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: edits-candidate-oci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-e2e-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RELEASE_DIR: ${{ runner.temp }}/edits-candidate-release
      RELEASE_TAG: edits-candidate-${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Build every artifact and run Docker plus OCI pytest E2E through one entrypoint
        run: >-
          nix run ./proofs/vim-nix#candidate --
          --repo-root "$GITHUB_WORKSPACE"
          --output "$RELEASE_DIR"
          --release-tag "$RELEASE_TAG"

      - name: Upload exact CI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edits-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/edits-candidate-release
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Create immutable candidate prerelease with OCI and ready-to-run Windows kit
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          if test -n "$existing"; then
            asset_count="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
            test "$asset_count" -ge 10
            echo "exact candidate release already exists with $asset_count assets: $RELEASE_TAG"
            exit 0
          fi
          mapfile -t assets < <(find "$RELEASE_DIR" -maxdepth 1 -type f \
            \( -name '*.docker.tar' -o -name '*.oci.tar' -o -name '*.windows.zip' \
               -o -name '*.evidence.zip' -o -name '*.git.bundle' -o -name '*.json' \
               -o -name '*.xml' -o -name 'SHA256SUMS' \) -print | sort)
          test "${#assets[@]}" -ge 10
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Edits operator-console candidate ${GITHUB_SHA:0:12}" \
            --notes-file "$RELEASE_DIR/RELEASE.md"
