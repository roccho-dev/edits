name: finalize PTY E2E refactor

on:
  push:
    branches:
      - refactor/pty-e2e-screenshot-20260822

permissions:
  contents: write

concurrency:
  group: finalize-pty-e2e-refactor-20260822
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: proof/vim-nix-herdr-oci-current-20260821
      EXPECTED_BASE: 6fbcdd0147b55975492954405e1f562074ddb9c2
      FEATURE: refactor/pty-e2e-screenshot-20260822
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"

      - name: Materialize product source if helper still exists
        shell: bash
        run: |
          set -euo pipefail
          actual_base=$(git rev-parse "origin/$TARGET")
          test "$actual_base" = "$EXPECTED_BASE"
          if test -f proofs/refactor-pty-e2e-screenshot.py; then
            python3 proofs/refactor-pty-e2e-screenshot.py
          fi

      - name: Verify narrow boundaries
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            packages/hq-vim/internal/smoke/smoke.go \
            packages/hq-vim/hq_vim_smoke_test.go \
            packages/hq-vim/canonical_conformance_test.go
          bash -n tools/vim-nix-local/verify.sh tools/vim-nix-local/capture-decision-entry.sh
          python3 -m py_compile tools/vim-nix-local/pty-shot.py
          test ! -e packages/hq-vim/internal/smoke/tty_test.go
          test ! -e proofs/vim-nix/hq-vim-native-popup-proof.patch
          test "$(grep -Rh '^func Test' packages/hq-vim --include='*_test.go' | wc -l | tr -d ' ')" = 4
          ! grep -R -n 'TestNativePopupArtifactUsesControllingTTY\|TestNativeHQFuzzyAutomaticPopupDoesNotAccept\|TestCanonicalHQVimConformance' \
            packages/hq-vim proofs/vim-nix tools/vim-nix-local
          (cd packages/hq-vim && go test ./... -count=1) | tee "$RUNNER_TEMP/go-test.log"
          cat proofs/vim-nix/run-proof.parts/*.sh > "$RUNNER_TEMP/run-proof.sh"
          bash -n "$RUNNER_TEMP/run-proof.sh"
          git diff --check

      - id: clean
        name: Create exact one-child product commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            proofs/refactor-pty-e2e-screenshot.py \
            .github/workflows/refactor-pty-e2e-screenshot.yml \
            .github/workflows/finalize-pty-e2e-refactor.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME=roccho GIT_AUTHOR_EMAIL=40359643+roccho-dev@users.noreply.github.com
          export GIT_COMMITTER_NAME=roccho GIT_COMMITTER_EMAIL=40359643+roccho-dev@users.noreply.github.com
          commit=$(printf '%s\n' 'refactor(hq-vim): keep narrow E2Es and PTY screenshot projection' | git commit-tree "$tree" -p "$EXPECTED_BASE")
          printf 'base=%s\ncommit=%s\ntree=%s\n' "$EXPECTED_BASE" "$commit" "$tree" | tee "$RUNNER_TEMP/identity.txt"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Write and upload receipt
        shell: bash
        run: |
          jq -n \
            --arg base "$EXPECTED_BASE" \
            --arg commit '${{ steps.clean.outputs.commit }}' \
            --arg tree '${{ steps.clean.outputs.tree }}' \
            '{schema:"edits.pty-e2e-finalize/1",status:"PASS",base:$base,resultCommit:$commit,resultTree:$tree,fastForward:true,goTests:"PASS",retainedTests:4,debugOnlyTTYTest:false,testOnlyPatch:false,screenshotRole:"projection-only"}' \
            > "$RUNNER_TEMP/receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: edits-pty-e2e-final-${{ steps.clean.outputs.commit }}
          path: |
            ${{ runner.temp }}/identity.txt
            ${{ runner.temp }}/receipt.json
            ${{ runner.temp }}/go-test.log
          if-no-files-found: error
          retention-days: 30

      - name: Fast-forward target and clean feature branch
        shell: bash
        run: |
          set -euo pipefail
          result='${{ steps.clean.outputs.commit }}'
          git push origin "$result":refs/heads/"$TARGET" \
            --force-with-lease=refs/heads/"$TARGET":"$EXPECTED_BASE"
          git push origin "$result":refs/heads/"$FEATURE" \
            --force-with-lease=refs/heads/"$FEATURE":"$GITHUB_SHA"
