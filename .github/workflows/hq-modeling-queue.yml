name: hq-modeling-queue

on:
  pull_request:
    paths:
      - 'packages/hq-modeling-queue/**'
      - '.github/workflows/hq-modeling-queue.yml'
  push:
    branches:
      - proposals
    paths:
      - 'packages/hq-modeling-queue/**'
      - '.github/workflows/hq-modeling-queue.yml'

jobs:
  validate-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate queue sample
        run: python3 packages/hq-modeling-queue/tools/validate_queue.py packages/hq-modeling-queue/examples/queue.sample.jsonl
      - name: Validate receipt sample
        run: python3 packages/hq-modeling-queue/tools/validate_queue.py packages/hq-modeling-queue/examples/receipt.sample.jsonl
      - name: Prove local queue append/readback/tail
        run: |
          rm -rf .local
          python3 packages/hq-modeling-queue/tools/queue_io.py append .local/queue.jsonl --from-file packages/hq-modeling-queue/examples/model-commit.input.json
          python3 packages/hq-modeling-queue/tools/queue_io.py read .local/queue.jsonl --summary > /tmp/queue.readback.jsonl
          python3 packages/hq-modeling-queue/tools/queue_io.py tail .local/queue.jsonl -n 1 > /tmp/queue.tail.jsonl
          python3 packages/hq-modeling-queue/tools/queue_io.py validate .local/queue.jsonl
          test "$(wc -l < /tmp/queue.readback.jsonl | tr -d ' ')" = "1"
          test "$(wc -l < /tmp/queue.tail.jsonl | tr -d ' ')" = "1"
      - name: Prove command conversion to model queue row
        run: |
          python3 packages/hq-modeling-queue/tools/command_to_queue.py packages/hq-modeling-queue/examples/command-request.model-add-edge.json > /tmp/model.queue.jsonl
          python3 packages/hq-modeling-queue/tools/validate_queue.py /tmp/model.queue.jsonl
          grep '"kind":"hq.modelCommitQueued.v1"' /tmp/model.queue.jsonl
      - name: Prove command conversion to agent task queue row
        run: |
          python3 packages/hq-modeling-queue/tools/command_to_queue.py packages/hq-modeling-queue/examples/command-request.agent-propose-model.json > /tmp/agent.queue.jsonl
          python3 packages/hq-modeling-queue/tools/validate_queue.py /tmp/agent.queue.jsonl
          grep '"kind":"hq.agentTaskQueued.v1"' /tmp/agent.queue.jsonl
      - name: Prove current target bridge fallback
        run: |
          rm -rf .local
          python3 packages/hq-modeling-queue/tools/current_target.py write .local/current-target.json --from-file packages/hq-modeling-queue/examples/current-target.sample.json
          python3 packages/hq-modeling-queue/tools/current_target.py validate .local/current-target.json
          python3 packages/hq-modeling-queue/tools/command_to_queue.py packages/hq-modeling-queue/examples/command-request.model-add-edge.no-target.json --target-file .local/current-target.json > /tmp/model.from-target.queue.jsonl
          python3 packages/hq-modeling-queue/tools/validate_queue.py /tmp/model.from-target.queue.jsonl
          grep '"targetRef":{"kind":"projectionNode","id":"pkg:core"}' /tmp/model.from-target.queue.jsonl
