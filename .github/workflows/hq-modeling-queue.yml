name: hq-modeling-queue

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'packages/hq-modeling-queue/**'
      - 'packages/hq-local-worker/**'
      - '.github/workflows/hq-modeling-queue.yml'
  push:
    branches:
      - proposals
    paths:
      - 'README.md'
      - 'docs/**'
      - 'packages/hq-modeling-queue/**'
      - 'packages/hq-local-worker/**'
      - '.github/workflows/hq-modeling-queue.yml'
  schedule:
    - cron: '*/5 * * * *'

jobs:
  validate-samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check edits boundary
        run: python3 packages/hq-modeling-queue/tools/check_edits_boundary.py .
      - name: Check command vocabulary boundary
        run: python3 packages/hq-modeling-queue/tools/check_command_vocabulary.py
      - name: Validate queue sample
        run: python3 packages/hq-modeling-queue/tools/validate_queue.py packages/hq-modeling-queue/examples/queue.sample.jsonl
      - name: Validate receipt sample
        run: python3 packages/hq-modeling-queue/tools/validate_queue.py packages/hq-modeling-queue/examples/receipt.sample.jsonl
      - name: Prove ops-compatible targetRef gate
        run: |
          python3 packages/hq-modeling-queue/tools/command_to_queue.py packages/hq-modeling-queue/examples/command-request.model-add-edge.json > /tmp/ops-model.queue.jsonl
          python3 packages/hq-modeling-queue/tools/command_to_queue.py packages/hq-modeling-queue/examples/command-request.agent-propose-model.json > /tmp/ops-agent.queue.jsonl
          python3 packages/hq-modeling-queue/tools/validate_queue.py /tmp/ops-model.queue.jsonl
          python3 packages/hq-modeling-queue/tools/validate_queue.py /tmp/ops-agent.queue.jsonl
          if python3 packages/hq-modeling-queue/tools/command_to_queue.py packages/hq-modeling-queue/examples/command-request.agent-no-target.json > /tmp/should-not-exist.jsonl; then
            echo 'expected missing targetRef command to fail'
            exit 1
          fi
          if python3 packages/hq-modeling-queue/tools/validate_queue.py packages/hq-modeling-queue/examples/ops-contract-invalid-target.jsonl; then
            echo 'expected missing targetRef queue row to fail'
            exit 1
          fi
      - name: Prove current target bridge is input-only
        run: |
          rm -rf .local
          python3 packages/hq-modeling-queue/tools/current_target.py write .local/current-target.json --from-file packages/hq-modeling-queue/examples/current-target.sample.json
          python3 packages/hq-modeling-queue/tools/current_target.py validate .local/current-target.json
          if python3 packages/hq-modeling-queue/tools/current_target.py validate packages/hq-modeling-queue/examples/current-target.authority-field.json; then
            echo 'expected authority-bearing current target to fail'
            exit 1
          fi
      - name: Prove local queue append/readback/tail
        run: |
          rm -rf .local
          python3 packages/hq-modeling-queue/tools/queue_io.py append .local/queue.jsonl --from-file packages/hq-modeling-queue/examples/model-commit.input.json
          python3 packages/hq-modeling-queue/tools/queue_io.py read .local/queue.jsonl --summary > /tmp/queue.readback.jsonl
          python3 packages/hq-modeling-queue/tools/queue_io.py tail .local/queue.jsonl -n 1 > /tmp/queue.tail.jsonl
          python3 packages/hq-modeling-queue/tools/queue_io.py validate .local/queue.jsonl
          test "$(wc -l < /tmp/queue.readback.jsonl | tr -d ' ')" = "1"
          test "$(wc -l < /tmp/queue.tail.jsonl | tr -d ' ')" = "1"
      - name: Prove command conversion to model queue row
        run: |
          python3 packages/hq-modeling-queue/tools/command_to_queue.py packages/hq-modeling-queue/examples/command-request.model-add-edge.json > /tmp/model.queue.jsonl
          python3 packages/hq-modeling-queue/tools/validate_queue.py /tmp/model.queue.jsonl
          grep '"kind":"hq.modelCommitQueued.v1"' /tmp/model.queue.jsonl
      - name: Prove command conversion to agent task queue row
        run: |
          python3 packages/hq-modeling-queue/tools/command_to_queue.py packages/hq-modeling-queue/examples/command-request.agent-propose-model.json > /tmp/agent.queue.jsonl
          python3 packages/hq-modeling-queue/tools/validate_queue.py /tmp/agent.queue.jsonl
          grep '"kind":"hq.agentTaskQueued.v1"' /tmp/agent.queue.jsonl
      - name: Prove current target bridge fallback
        run: |
          rm -rf .local
          python3 packages/hq-modeling-queue/tools/current_target.py write .local/current-target.json --from-file packages/hq-modeling-queue/examples/current-target.sample.json
          python3 packages/hq-modeling-queue/tools/current_target.py validate .local/current-target.json
          python3 packages/hq-modeling-queue/tools/command_to_queue.py packages/hq-modeling-queue/examples/command-request.model-add-edge.no-target.json --target-file .local/current-target.json > /tmp/model.from-target.queue.jsonl
          python3 packages/hq-modeling-queue/tools/validate_queue.py /tmp/model.from-target.queue.jsonl
          grep '"targetRef":{"kind":"projectionNode","id":"pkg:core"}' /tmp/model.from-target.queue.jsonl
      - name: Prove legacy local worker receipt and projection evidence
        run: |
          rm -rf .local
          python3 packages/hq-modeling-queue/tools/command_to_queue.py packages/hq-modeling-queue/examples/command-request.model-add-edge.json > /tmp/worker.queue.jsonl
          python3 packages/hq-local-worker/tools/local_worker.py process --queue /tmp/worker.queue.jsonl --receipt .local/receipt.jsonl --state .local/shadow-model.json --projection .local/current-projection.json
          python3 packages/hq-modeling-queue/tools/validate_queue.py .local/receipt.jsonl
          grep '"status":"processed"' .local/receipt.jsonl
          test -s .local/current-projection.json
      - name: Prove malformed queue row writes legacy failed receipt evidence
        run: |
          rm -rf .local
          printf '{"kind":' > /tmp/broken.queue.jsonl
          python3 packages/hq-local-worker/tools/local_worker.py process --queue /tmp/broken.queue.jsonl --receipt .local/receipt.jsonl --state .local/shadow-model.json --projection .local/current-projection.json
          python3 packages/hq-modeling-queue/tools/validate_queue.py .local/receipt.jsonl
          grep '"status":"failed"' .local/receipt.jsonl
          grep 'invalid JSONL row' .local/receipt.jsonl
      - name: Prove duplicate idempotency is not reprocessed by legacy proof
        run: |
          rm -rf .local
          python3 packages/hq-modeling-queue/tools/command_to_queue.py packages/hq-modeling-queue/examples/command-request.model-add-edge.json > /tmp/dup.row.jsonl
          cat /tmp/dup.row.jsonl /tmp/dup.row.jsonl > /tmp/dup.queue.jsonl
          python3 packages/hq-local-worker/tools/local_worker.py process --queue /tmp/dup.queue.jsonl --receipt .local/receipt.jsonl --state .local/shadow-model.json --projection .local/current-projection.json
          test "$(wc -l < .local/receipt.jsonl | tr -d ' ')" = "1"
          python3 packages/hq-modeling-queue/tools/validate_queue.py .local/receipt.jsonl
      - name: Prove legacy vertical slice script
        run: bash packages/hq-local-worker/proofs/vertical_slice.sh

  vim-nix-exact-proof:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'proof/vim-nix-herdr-oci-current-20260821')
    concurrency:
      group: vim-nix-exact-proof-20260821-008
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARTIFACT: ${{ runner.temp }}/vim-nix-herdr-oci-proof
      IMAGE_REF: roccho/vim-nix-herdr-hq-proof:d83bf4c
      OCI_IMAGE_REF: roccho/vim-nix-herdr-hq-proof:oci-d83bf4c
    steps:
      - name: Checkout control revision
        uses: actions/checkout@v4
        with:
          ref: proposals
          fetch-depth: 0
          persist-credentials: false

      - id: request
        name: Read request and checkout exact canonical proof head
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          request = json.loads(pathlib.Path('proofs/vim-nix/requests/current.json').read_text(encoding='utf-8'))
          if request.get('schema') != 'edits.vimNixOciProofRequest/1':
              raise SystemExit('unsupported request schema')
          commit = request.get('commit', '')
          tree = request.get('tree', '')
          ref = request.get('ref', '')
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('invalid request commit')
          if not re.fullmatch(r'[0-9a-f]{40}', tree):
              raise SystemExit('invalid request tree')
          if ref != 'refs/heads/proof/vim-nix-herdr-oci-current-20260821':
              raise SystemExit('request ref outside canonical proof branch')
          with open(sys.argv[1], 'a', encoding='utf-8') as output:
              print(f'commit={commit}', file=output)
              print(f'tree={tree}', file=output)
              print(f'ref={ref}', file=output)
          PY
          commit=$(jq -er '.commit' proofs/vim-nix/requests/current.json)
          tree=$(jq -er '.tree' proofs/vim-nix/requests/current.json)
          ref=$(jq -er '.ref' proofs/vim-nix/requests/current.json)
          git fetch --no-tags origin "$ref"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$commit"
          test "$(git rev-parse "$commit^{tree}")" = "$tree"
          git checkout --detach "$commit"
          test "$(git rev-parse HEAD)" = "$commit"
          test "$(git rev-parse 'HEAD^{tree}')" = "$tree"
          test -z "$(git status --porcelain=v1)"

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Execute exact Nix, Herdr PTY, worker, Docker, and OCI proof
        shell: bash
        run: |
          set -euo pipefail
          source_commit=$(git rev-parse HEAD)
          cat proofs/vim-nix/ci.parts/*.sh > "$RUNNER_TEMP/vim-nix-proof-ci.sh"
          chmod 0700 "$RUNNER_TEMP/vim-nix-proof-ci.sh"
          GITHUB_SHA="$source_commit" "$RUNNER_TEMP/vim-nix-proof-ci.sh"

      - name: Preserve exact source and partial evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT/source"
          git bundle create "$ARTIFACT/source/edits-vim-nix-herdr-oci.git.bundle" HEAD
          python3 - <<'PY'
          import pathlib, zipfile
          out = pathlib.Path(__import__('os').environ['ARTIFACT']) / 'source' / 'edits-vim-nix-herdr-oci.source.zip'
          paths = [
              pathlib.Path('proofs/vim-nix'),
              pathlib.Path('tools/vim-nix-local'),
              pathlib.Path('docs/operations/vim-nix-local-first.md'),
              pathlib.Path('.github/workflows/proof-vim-nix-oci.yml'),
          ]
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in paths:
                  if path.is_dir():
                      for file in sorted(path.rglob('*')):
                          if file.is_file():
                              archive.write(file, file.as_posix())
                  elif path.is_file():
                      archive.write(path, path.as_posix())
          PY
          git status --porcelain=v1 > "$ARTIFACT/source/git-status.txt"
          printf '%s\n' "$(git rev-parse HEAD)" > "$ARTIFACT/source/commit.txt"
          printf '%s\n' "$(git rev-parse 'HEAD^{tree}')" > "$ARTIFACT/source/tree.txt"

      - name: Upload exact runtime and evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vim-nix-herdr-hq-exact-${{ steps.request.outputs.commit }}
          path: ${{ runner.temp }}/vim-nix-herdr-oci-proof
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
