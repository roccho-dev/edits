name: hq-pty-vim-rsc-windows

on:
  push:
    branches:
      - proposal/edits/hq-pty-vim-explorer-260708
  pull_request:
    paths:
      - 'packages/hq-pty-vim-rsc/**'
      - '.github/workflows/hq-pty-vim-rsc-windows.yml'

jobs:
  windows-build-and-behavior:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/hq-pty-vim-rsc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Resolve Go modules
        shell: pwsh
        run: go mod tidy
      - name: Test all packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cache | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue cache\windows-go-test.failed
          go test -v ./... *> cache\windows-go-test.log
          $exit = $LASTEXITCODE
          if ($exit -ne 0) {
            "exit=$exit" | Out-File cache\windows-go-test.failed
          }
          Get-Content cache\windows-go-test.log -Raw | Write-Output
      - name: Build Windows launcher hq.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -o dist/hq.exe ./cmd/hqwin
      - name: Check Windows Explorer launcher behavior
        shell: pwsh
        run: ./scripts/proof_windows_launcher.ps1
      - name: Build full ConPTY visual proof binary
        shell: pwsh
        run: go build -o dist/hqconpty.exe ./cmd/hqconpty
      - name: Resolve non-Git Vim for ConPTY visual proof
        shell: pwsh
        timeout-minutes: 6
        run: |
          function Find-NonGitVim {
            $searchRoots = @(
              'C:\tools',
              'C:\Program Files\Vim',
              'C:\ProgramData\chocolatey\lib'
            )
            foreach ($root in $searchRoots) {
              if (Test-Path $root) {
                $found = Get-ChildItem $root -Recurse -Filter vim.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -notlike '*\Git\*' } |
                  Sort-Object FullName -Descending |
                  Select-Object -First 1
                if ($found) { return $found.FullName }
              }
            }
            $cmd = Get-Command vim.exe -ErrorAction SilentlyContinue
            if ($cmd -and ($cmd.Source -notlike '*\Git\*')) { return $cmd.Source }
            return $null
          }

          $vim = Find-NonGitVim
          if (-not $vim) {
            choco install vim -y --no-progress --limit-output
            $vim = Find-NonGitVim
          }
          if (-not $vim) { throw 'non-Git vim.exe not found' }
          "VIM_EXE=$vim" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Vim: $vim"
      - name: Check Windows ConPTY Vim visual projection
        shell: pwsh
        timeout-minutes: 3
        run: |
          New-Item -ItemType Directory -Force -Path cache | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue cache\windows-conpty-vim-visual.failed
          $stdout = "cache\windows-conpty-vim-visual.stdout.log"
          $stderr = "cache\windows-conpty-vim-visual.stderr.log"
          Remove-Item -Force -ErrorAction SilentlyContinue $stdout, $stderr, cache\windows-conpty-vim-visual.log
          $args = @(
            "--vim", "$env:VIM_EXE",
            "--out", "cache\windows-conpty-vim-visual.json",
            "--trace", "cache\windows-conpty-vim-visual.trace.jsonl",
            "--screen-text", "cache\windows-conpty-vim-visual.screen.txt",
            "--raw", "cache\windows-conpty-vim-visual.pty.raw"
          )
          $p = Start-Process -FilePath ".\dist\hqconpty.exe" -ArgumentList $args -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) {
            "timeout=120s" | Out-File cache\windows-conpty-vim-visual.failed
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          } elseif ($p.ExitCode -ne 0) {
            "exit=$($p.ExitCode)" | Out-File cache\windows-conpty-vim-visual.failed
          }
          if (Test-Path $stdout) { Get-Content $stdout -Raw | Tee-Object -FilePath cache\windows-conpty-vim-visual.log -Append | Write-Output }
          if (Test-Path $stderr) { Get-Content $stderr -Raw | Tee-Object -FilePath cache\windows-conpty-vim-visual.log -Append | Write-Output }
      - name: Upload checked Windows hq and Vim adapter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hq-pty-vim-rsc-windows-checked
          path: |
            packages/hq-pty-vim-rsc/go.sum
            packages/hq-pty-vim-rsc/dist/hq.exe
            packages/hq-pty-vim-rsc/dist/hqconpty.exe
            packages/hq-pty-vim-rsc/vim/**
            packages/hq-pty-vim-rsc/cache/windows-*.json
            packages/hq-pty-vim-rsc/cache/windows-*.jsonl
            packages/hq-pty-vim-rsc/cache/windows-*.txt
            packages/hq-pty-vim-rsc/cache/windows-*.raw
            packages/hq-pty-vim-rsc/cache/windows-*.log
            packages/hq-pty-vim-rsc/cache/windows-*.failed
      - name: Assert Windows test and ConPTY Vim visual projection
        shell: pwsh
        run: |
          if (Test-Path cache\windows-go-test.failed) {
            Get-Content cache\windows-go-test.failed -Raw | Write-Output
            Get-Content cache\windows-go-test.log -Raw | Write-Output
            throw 'Windows go test failed'
          }
          if (Test-Path cache\windows-conpty-vim-visual.failed) {
            Get-Content cache\windows-conpty-vim-visual.failed -Raw | Write-Output
            if (Test-Path cache\windows-conpty-vim-visual.log) { Get-Content cache\windows-conpty-vim-visual.log -Raw | Write-Output }
            throw 'Windows ConPTY visual proof command failed'
          }
          $proof = Get-Content cache\windows-conpty-vim-visual.json -Raw | ConvertFrom-Json
          if (-not $proof.visual_projection_ok) { throw 'visual_projection_ok was false' }
