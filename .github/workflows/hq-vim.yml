name: hq-vim smoke

on:
  pull_request:
    paths:
      - 'packages/hq-vim/**'
      - '.github/workflows/hq-vim.yml'

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/hq-vim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install Vim on Windows
        if: runner.os == 'Windows'
        run: choco install vim -y --no-progress --limit-output
      - name: Install Vim on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y vim
      - name: Checkout vim-lsp
        run: git clone --depth=1 https://github.com/prabirshrestha/vim-lsp.git "${{ runner.temp }}/vim-lsp"
      - name: Run Go OS smoke tests
        env:
          VIM_LSP_PATH: ${{ runner.temp }}/vim-lsp
        run: go test -v ./...
