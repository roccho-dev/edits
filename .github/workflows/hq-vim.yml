name: hq-vim conformance

on:
  pull_request:
    paths:
      - 'packages/hq-vim/**'
      - 'proofs/vim-nix/**'
      - '.github/workflows/hq-vim.yml'

permissions:
  contents: read

concurrency:
  group: hq-vim-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout edits
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.x'

      - name: Install Vim on Windows
        if: runner.os == 'Windows'
        run: choco install vim -y --no-progress --limit-output

      - name: Resolve native Vim on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $roots = @(
            'C:\tools',
            'C:\Program Files\Vim',
            'C:\ProgramData\chocolatey\lib'
          )
          $candidates = foreach ($root in $roots) {
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -Filter vim.exe -ErrorAction SilentlyContinue
            }
          }
          $vim = $candidates |
            Where-Object { $_.FullName -notmatch '\\Git\\|\\usr\\bin\\vim\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $vim) { throw 'native non-Git vim.exe not found' }
          "VIM_EXE=$($vim.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $vim.FullName --version | Select-Object -First 3

      - name: Setup pinned Vim on Linux
        if: runner.os == 'Linux'
        id: linux-vim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7
        with:
          version: v9.2.0478

      - name: Resolve pinned Vim on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          PINNED_VIM: ${{ steps.linux-vim.outputs.executable }}
        run: |
          test -x "$PINNED_VIM"
          echo "VIM_EXE=$PINNED_VIM" >> "$GITHUB_ENV"
          "$PINNED_VIM" --version | head -n 3

      - name: Checkout pinned yegappan/lsp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yegappan/lsp
          ref: 989016ae2ae4cbf304a9ca29478f47fec794493f
          path: yegappan-lsp

      - name: Checkout exact canonical hq
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: roccho-dev/hq
          ref: 779a298f4efcff8df60205aaf973cb224388a82b
          path: canonical-hq

      - name: Record canonical hq commit
        shell: bash
        run: echo "HQ_CANONICAL_SOURCE_SHA=$(git -C canonical-hq rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build canonical hq on Windows
        if: runner.os == 'Windows'
        working-directory: canonical-hq
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP\hq.exe" ./cmd/hq
          "HQ_CANONICAL_BIN=$env:RUNNER_TEMP\hq.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build canonical hq on Linux
        if: runner.os == 'Linux'
        working-directory: canonical-hq
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/hq" ./cmd/hq
          echo "HQ_CANONICAL_BIN=$RUNNER_TEMP/hq" >> "$GITHUB_ENV"

      - name: Run stub and canonical Vim conformance
        working-directory: packages/hq-vim
        shell: bash
        env:
          VIM9_LSP_PATH: ${{ github.workspace }}/yegappan-lsp
          HQ_CONFORMANCE_ARTIFACT: ${{ github.workspace }}/artifacts/hq-vim-conformance-${{ runner.os }}.json
        run: |
          mkdir -p "${{ github.workspace }}/artifacts"
          export HQ_NATIVE_HQ_FUZZY_PROOF=1
          export HQ_BIN="$HQ_CANONICAL_BIN"
          set -o pipefail
          go test -v ./... 2>&1 | tee "${{ github.workspace }}/artifacts/hq-vim-conformance-${RUNNER_OS}.log"

      - name: Run accepted-history native popup E2E on Linux
        if: runner.os == 'Linux'
        working-directory: packages/hq-vim
        shell: bash
        env:
          VIM9_LSP_PATH: ${{ github.workspace }}/yegappan-lsp
          HQ_CONFORMANCE_ARTIFACT: ${{ github.workspace }}/artifacts/hq-vim-conformance-${{ runner.os }}.json
        run: |
          set -euo pipefail
          export HQ_NATIVE_HQ_FUZZY_PROOF=1
          export HQ_CHOICE_E2E=1
          export HQ_BIN="$HQ_CANONICAL_BIN"
          script -q -e -f -c "go test -count=1 -run '^TestAcceptedHistoryRecallE2E$' -v" /dev/null \
            2>&1 | tee "${{ github.workspace }}/artifacts/hq-vim-accepted-history-${RUNNER_OS}.log"

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hq-vim-conformance-${{ runner.os }}
          path: |
            artifacts/hq-vim-conformance-${{ runner.os }}.json
            artifacts/hq-vim-conformance-${{ runner.os }}.log
            artifacts/hq-vim-accepted-history-*.json
            artifacts/hq-vim-accepted-history-*.log
          if-no-files-found: error

  vim-nix-oci-proof:
    if: github.event.pull_request.head.ref == 'proof/vim-nix-herdr-oci-current-20260821'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARTIFACT: ${{ runner.temp }}/vim-nix-herdr-oci-proof
      IMAGE_REF: roccho/vim-nix-herdr-hq-proof:d83bf4c
      OCI_IMAGE_REF: roccho/vim-nix-herdr-hq-proof:oci-d83bf4c
    steps:
      - name: Checkout isolated proof candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify bounded proof surface
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = 'proof/vim-nix-herdr-oci-current-20260821'
          test -f proofs/vim-nix/flake.nix
          test -f proofs/vim-nix/flake.lock
          test -f proofs/vim-nix/verify_oci.py
          test -f proofs/vim-nix/WSLC-TEST.md
          test "$(find proofs/vim-nix/ci.parts -type f | wc -l | tr -d ' ')" = 2
          test "$(find proofs/vim-nix/run-proof.parts -type f | wc -l | tr -d ' ')" = 4
          test -z "$(git status --porcelain=v1)"
          git rev-parse HEAD > "$RUNNER_TEMP/proof-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/proof-tree.txt"

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Execute complete materialization and runtime proof
        shell: bash
        run: |
          set -euo pipefail
          cat proofs/vim-nix/ci.parts/*.sh > "$RUNNER_TEMP/vim-nix-proof-ci.sh"
          chmod 0700 "$RUNNER_TEMP/vim-nix-proof-ci.sh"
          "$RUNNER_TEMP/vim-nix-proof-ci.sh"

      - name: Upload downloadable OCI and WSLC proof pack
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vim-nix-herdr-hq-oci-wslc-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/vim-nix-herdr-oci-proof
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
