name: integrate focused E2E and PTY screenshots

on:
  push:
    branches:
      - automation/focused-e2e-screenshot-refactor-20260822
  pull_request:
    branches:
      - proof/vim-nix-herdr-oci-current-20260821

permissions:
  contents: write

concurrency:
  group: focused-e2e-screenshot-refactor-20260822
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE: 6fbcdd0147b55975492954405e1f562074ddb9c2
      HELPER_BRANCH: automation/focused-e2e-screenshot-refactor-20260822
      FINAL_BRANCH: ux/focused-e2e-screenshot-refactor-20260822
      PATCH_PART_PREFIX: proofs/vim-nix/focused-e2e-screenshot-refactor.patch.gz.b64.part-
      PATCH_GZ_SHA256: be84436786be3cd473f5be5a872ec9961d09ceb7e895c6c4e50529fff8283ee4
      PATCH_SHA256: 49c8f646b3c0a2e5c7f8dc4d53803fa7b7f469d28580500d22a372a6879b80ce
      EXPECTED_HQ: 779a298f4efcff8df60205aaf973cb224388a82b
      ARTIFACT: /tmp/focused-e2e-screenshot

    steps:
      - name: Checkout exact helper request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bounded helper request and decode exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD | sort)
          expected=(
            .github/workflows/integrate-focused-e2e-screenshot.yml
            proofs/vim-nix/focused-e2e-screenshot-refactor.patch.gz.b64.part-00
            proofs/vim-nix/focused-e2e-screenshot-refactor.patch.gz.b64.part-01
            proofs/vim-nix/focused-e2e-screenshot-refactor.patch.gz.b64.part-02
            proofs/vim-nix/focused-e2e-screenshot-refactor.patch.gz.b64.part-03
            proofs/vim-nix/focused-e2e-screenshot-refactor.patch.gz.b64.part-04
            proofs/vim-nix/focused-e2e-screenshot-refactor.patch.gz.b64.part-04a
            proofs/vim-nix/focused-e2e-screenshot-refactor.patch.gz.b64.part-04b
            proofs/vim-nix/focused-e2e-screenshot-refactor.patch.gz.b64.part-05a
            proofs/vim-nix/focused-e2e-screenshot-refactor.patch.gz.b64.part-05b
          )
          test "${changed[*]}" = "${expected[*]}" || {
            printf 'unexpected helper paths\nexpected: %s\nactual:   %s\n' "${expected[*]}" "${changed[*]}" >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/focused-patch"
          cat \
            "${PATCH_PART_PREFIX}00" \
            "${PATCH_PART_PREFIX}01" \
            "${PATCH_PART_PREFIX}02" \
            "${PATCH_PART_PREFIX}03" \
            "${PATCH_PART_PREFIX}04a" \
            "${PATCH_PART_PREFIX}04b" \
            "${PATCH_PART_PREFIX}05a" \
            "${PATCH_PART_PREFIX}05b" \
            | base64 --decode > "$RUNNER_TEMP/focused-patch/change.patch.gz"
          test "$(sha256sum "$RUNNER_TEMP/focused-patch/change.patch.gz" | cut -d' ' -f1)" = "$PATCH_GZ_SHA256"
          gzip -dc "$RUNNER_TEMP/focused-patch/change.patch.gz" > "$RUNNER_TEMP/focused-patch/change.patch"
          test "$(sha256sum "$RUNNER_TEMP/focused-patch/change.patch" | cut -d' ' -f1)" = "$PATCH_SHA256"
          git apply --check "$RUNNER_TEMP/focused-patch/change.patch"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - id: materialize
        name: Apply exact change and materialize one clean child commit
        shell: bash
        run: |
          set -euo pipefail
          git apply --index "$RUNNER_TEMP/focused-patch/change.patch"

          pushd proofs/vim-nix >/dev/null
          nix flake lock --update-input hq
          popd >/dev/null
          test "$(jq -r '.nodes.hq.locked.rev' proofs/vim-nix/flake.lock)" = "$EXPECTED_HQ"
          test "$(jq -r '.nodes.hq.original.rev' proofs/vim-nix/flake.lock)" = "$EXPECTED_HQ"
          test "$(jq -r '.nodes.root.inputs | has("edits-src")' proofs/vim-nix/flake.lock)" = false

          gofmt -w \
            packages/hq-vim/direct_submit_e2e_test.go \
            packages/hq-vim/hq_vim_smoke_test.go \
            packages/hq-vim/internal/smoke/smoke.go
          bash -n \
            proofs/vim-nix/capture-pty-e2e.sh \
            tools/vim-nix-local/verify.sh \
            tools/vim-nix-local/vim-nix
          cat proofs/vim-nix/run-proof.parts/*.sh > "$RUNNER_TEMP/run-proof.sh"
          cat proofs/vim-nix/ci.parts/*.sh > "$RUNNER_TEMP/ci-proof.sh"
          bash -n "$RUNNER_TEMP/run-proof.sh" "$RUNNER_TEMP/ci-proof.sh"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile tools/vim-nix-local/pack.py

          git rm "${PATCH_PART_PREFIX}"* .github/workflows/integrate-focused-e2e-screenshot.yml
          git add -A
          git diff --cached --check

          cat > "$RUNNER_TEMP/expected-paths.txt" <<'EOF'
          .github/workflows/bounded-vim-nix-oci-proof.yml
          .github/workflows/proof-vim-nix-oci.yml
          docs/operations/vim-nix-local-first.md
          packages/hq-vim/README.md
          packages/hq-vim/canonical_conformance_test.go
          packages/hq-vim/direct_submit_e2e_test.go
          packages/hq-vim/hq_vim_smoke_test.go
          packages/hq-vim/internal/smoke/smoke.go
          packages/hq-vim/internal/smoke/tty_test.go
          proofs/vim-nix/WSLC-TEST.md
          proofs/vim-nix/capture-pty-e2e.sh
          proofs/vim-nix/ci.parts/00.sh
          proofs/vim-nix/ci.parts/01.sh
          proofs/vim-nix/fixtures/runtime-accepted.jsonl
          proofs/vim-nix/fixtures/runtime-world.jsonl
          proofs/vim-nix/flake.lock
          proofs/vim-nix/flake.nix
          proofs/vim-nix/flake.parts/00.nix
          proofs/vim-nix/flake.parts/01.nix
          proofs/vim-nix/hq-vim-native-popup-proof.patch
          proofs/vim-nix/run-proof.parts/00.sh
          proofs/vim-nix/run-proof.parts/01.sh
          proofs/vim-nix/run-proof.parts/02.sh
          proofs/vim-nix/run-proof.parts/03.sh
          tools/vim-nix-local/pack.py
          tools/vim-nix-local/verify.sh
          tools/vim-nix-local/vim-nix
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected-paths.txt"
          git diff --cached --name-only "$BASE" | sort > "$RUNNER_TEMP/actual-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/actual-paths.txt"

          tree=$(git write-tree)
          export GIT_AUTHOR_NAME=roccho
          export GIT_AUTHOR_EMAIL=40359643+roccho-dev@users.noreply.github.com
          export GIT_COMMITTER_NAME=roccho
          export GIT_COMMITTER_EMAIL=40359643+roccho-dev@users.noreply.github.com
          commit=$(printf '%s\n' 'test(hq-vim): keep focused E2Es and observation-only PTY capture' | git commit-tree "$tree" -p "$BASE")
          printf 'base=%s\ncommit=%s\ntree=%s\n' "$BASE" "$commit" "$tree" | tee "$RUNNER_TEMP/focused-identity.txt"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

          git checkout --detach "$commit"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-parse HEAD^{tree})" = "$tree"
          test -z "$(compgen -G "${PATCH_PART_PREFIX}*" || true)"
          test ! -e .github/workflows/integrate-focused-e2e-screenshot.yml
          test -z "$(git status --porcelain=v1)"

      - name: Run source-level focused tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT"/{source,product,e2e,screenshots}
          cp "$RUNNER_TEMP/focused-identity.txt" "$ARTIFACT/source/identity.txt"
          git rev-parse HEAD > "$ARTIFACT/source/commit.txt"
          git rev-parse HEAD^{tree} > "$ARTIFACT/source/tree.txt"
          git diff --name-status "$BASE" HEAD > "$ARTIFACT/source/change-paths.txt"
          (
            cd packages/hq-vim
            go test ./... -count=1 | tee "$ARTIFACT/source/go-test.log"
          )
          mapfile -t tests < <(
            grep -Rh '^func Test' packages/hq-vim --include='*_test.go' \
              | sed -E 's/^func (Test[^ (]+).*/\1/' | sort
          )
          expected=(
            TestAcceptedSubmitKeepsDraftOnUnsafeConsumption
            TestAgentDecisionSubmitE2E
            TestAgentDefaultChoiceE2E
            TestAgentPromptFieldChoiceE2E
            TestDirectCommandSubmitE2E
            TestDirectFallbackChoiceE2E
            TestEditorSurfaceAndBindingFailClosed
            TestUnicodeDirectFieldValueE2E
          )
          test "${tests[*]}" = "${expected[*]}"
          printf '%s\n' "${tests[@]}" > "$ARTIFACT/source/focused-tests.txt"

      - id: product
        name: Build exact Nix product and prove normal/offline identity
        shell: bash
        run: |
          set -euo pipefail
          pushd proofs/vim-nix >/dev/null
          lock_before=$(sha256sum flake.lock | cut -d' ' -f1)
          product=$(nix build --no-link --print-out-paths .#default)
          product_offline=$(nix build --offline --no-write-lock-file --no-link --print-out-paths .#default)
          lock_after=$(sha256sum flake.lock | cut -d' ' -f1)
          popd >/dev/null
          test "$lock_before" = "$lock_after"
          test "$product" = "$product_offline"
          printf '%s\n' "$product" | tee "$ARTIFACT/product/store-path.txt"
          printf '%s\n' "$lock_before" > "$ARTIFACT/product/flake-lock.sha256"
          nix-store -qR "$product" | sort > "$ARTIFACT/product/closure-paths.txt"
          nix path-info -rS "$product" > "$ARTIFACT/product/closure-size.txt"
          "$product/bin/herdr" --version > "$ARTIFACT/product/herdr.version.txt"
          "$product/bin/vim" --version > "$ARTIFACT/product/vim.version.txt"
          "$product/bin/hq" --version > "$ARTIFACT/product/hq.version.txt" 2>&1 || true
          echo "path=$product" >> "$GITHUB_OUTPUT"

      - name: Run eight independent exact-product editor E2Es
        shell: bash
        env:
          PROOF: ${{ steps.product.outputs.path }}
        run: |
          set -euo pipefail
          export HQ_BIN="$PROOF/bin/hq"
          export VIM_EXE="$PROOF/bin/vim"
          export VIM9_LSP_PATH="$PROOF/share/yegappan-lsp"
          export VIMRUNTIME="$PROOF/share/vim/vim92"
          export LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=xterm-256color

          for test_name in \
            TestAgentDefaultChoiceE2E \
            TestAgentPromptFieldChoiceE2E \
            TestDirectFallbackChoiceE2E \
            TestUnicodeDirectFieldValueE2E; do
            command=$(printf 'cd %q && HQ_CHOICE_E2E=1 HQ_BIN=%q VIM_EXE=%q VIM9_LSP_PATH=%q VIMRUNTIME=%q LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=xterm-256color %q -test.v -test.count=1 -test.run %q' \
              "$PROOF/share/hq-vim" "$HQ_BIN" "$VIM_EXE" "$VIM9_LSP_PATH" "$VIMRUNTIME" \
              "$PROOF/bin/hq-vim.test" "^${test_name}$")
            timeout 90s script -qefc "$command" "$ARTIFACT/e2e/${test_name}.typescript" \
              > "$ARTIFACT/e2e/${test_name}.log" 2>&1
            grep -F -- "--- PASS: $test_name" "$ARTIFACT/e2e/${test_name}.log" >/dev/null
          done

          for test_name in \
            TestEditorSurfaceAndBindingFailClosed \
            TestAgentDecisionSubmitE2E \
            TestDirectCommandSubmitE2E \
            TestAcceptedSubmitKeepsDraftOnUnsafeConsumption; do
            (
              cd "$PROOF/share/hq-vim"
              "$PROOF/bin/hq-vim.test" -test.v -test.count=1 -test.run "^${test_name}$"
            ) > "$ARTIFACT/e2e/${test_name}.log" 2>&1
            grep -F -- "--- PASS: $test_name" "$ARTIFACT/e2e/${test_name}.log" >/dev/null
          done

      - name: Install screenshot-only host adapters
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xterm scrot x11-utils

      - name: Capture two focused editor E2Es and independent runtime E2E
        shell: bash
        env:
          PROOF_ROOT: ${{ steps.product.outputs.path }}
          PTY_CAPTURE_OUT: ${{ runner.temp }}/focused-e2e-screenshot/screenshots
        run: |
          set -euo pipefail
          bash proofs/vim-nix/capture-pty-e2e.sh | tee "$ARTIFACT/screenshots/capture.log"
          jq -e '.status == "PASS" and .captureAddsBehavior == false and .e2eComposition == false' \
            "$ARTIFACT/screenshots/receipt.json" >/dev/null
          jq -e '.status == "PASS" and .gates.resultKinds == ["accepted","started","stdout","completed"] and .gates.residualProcessCount == 0' \
            "$ARTIFACT/screenshots/runtime-evidence/receipt.json" >/dev/null
          (cd "$ARTIFACT/screenshots" && sha256sum --check SHA256SUMS)

      - name: Assemble receipt and exact Git bundle
        shell: bash
        env:
          CLEAN_COMMIT: ${{ steps.materialize.outputs.commit }}
          CLEAN_TREE: ${{ steps.materialize.outputs.tree }}
          PROOF: ${{ steps.product.outputs.path }}
        run: |
          set -euo pipefail
          git bundle create "$ARTIFACT/source/edits-focused-e2e-screenshot.git.bundle" HEAD
          git bundle verify "$ARTIFACT/source/edits-focused-e2e-screenshot.git.bundle" \
            > "$ARTIFACT/source/bundle-verify.txt"
          jq -n \
            --arg base "$BASE" \
            --arg commit "$CLEAN_COMMIT" \
            --arg tree "$CLEAN_TREE" \
            --arg product "$PROOF" \
            --arg patchSha256 "$PATCH_SHA256" \
            --arg patchGzSha256 "$PATCH_GZ_SHA256" '{
              schema:"edits.focused-e2e-pty-capture/1",
              status:"PASS",
              base:$base,
              commit:$commit,
              tree:$tree,
              productStorePath:$product,
              patchSha256:$patchSha256,
              patchGzipSha256:$patchGzSha256,
              editorBehaviorE2Es:8,
              runtimeLifecycleE2Es:1,
              screenshotCount:3,
              screenshotMechanism:"observation-only",
              e2eComposition:false,
              normalOfflineSameStorePath:true
            }' > "$ARTIFACT/receipt.json"
          (cd "$ARTIFACT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$ARTIFACT" && sha256sum --check SHA256SUMS)

      - name: Push only the clean verified child branch
        shell: bash
        env:
          CLEAN_COMMIT: ${{ steps.materialize.outputs.commit }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$FINAL_BRANCH" >/dev/null 2>&1; then
            echo "final branch already exists; refusing replacement" >&2
            exit 1
          fi
          git push origin "$CLEAN_COMMIT:refs/heads/$FINAL_BRANCH"

      - name: Upload exact source, E2E receipts, and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: focused-e2e-screenshot-${{ steps.materialize.outputs.commit }}
          path: ${{ runner.temp }}/focused-e2e-screenshot
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
