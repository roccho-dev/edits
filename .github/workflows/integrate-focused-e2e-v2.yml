name: integrate focused E2E v2

on:
  push:
    branches:
      - automation/focused-e2e-v2-20260822
  pull_request:
    branches:
      - proof/vim-nix-herdr-oci-current-20260821

permissions:
  contents: write

concurrency:
  group: focused-e2e-v2-20260822
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE: 6fbcdd0147b55975492954405e1f562074ddb9c2
      SOURCE_COMMIT: ad856db704b85b2750cf969166fe36fd1ac1bb1a
      SOURCE_TREE: 0fd2622285588c9c85f03b53de0917b5d341d4f4
      EXPECTED_HQ: 779a298f4efcff8df60205aaf973cb224388a82b
      FINAL_BRANCH: ux/focused-e2e-screenshot-refactor-20260822
      ARTIFACT: /tmp/focused-e2e-screenshot-v2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Install screenshot-only host adapters
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xterm scrot x11-utils

      - id: integrate
        name: Run exact source pin, independent E2Es, and observation-only screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT"
          tmp="$RUNNER_TEMP/focused-e2e-v2-integrator"
          mkdir -p "$tmp"
          base64 --decode proofs/vim-nix/integrate-focused-e2e-v2.sh.gz.b64 > "$tmp/integrate.sh.gz"
          gzip -dc "$tmp/integrate.sh.gz" > "$tmp/integrate.sh"
          sha256sum "$tmp/integrate.sh.gz" "$tmp/integrate.sh" \
            | tee "$ARTIFACT/integrator-sha256.before-helper-fixes.txt"
          python3 - "$tmp/integrate.sh" <<'PY'
          from pathlib import Path
          import os
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          old_identity = 'test "$(git rev-parse "$SOURCE_COMMIT^")" = "$BASE"'
          new_identity = 'test "$(git merge-base "$SOURCE_COMMIT" "$BASE")" = "$BASE"'
          identity_count = text.count(old_identity)
          if identity_count != 1:
              raise SystemExit(f"expected one identity-gate match, got {identity_count}")
          text = text.replace(old_identity, new_identity, 1)

          old_source = "4e36f0261147e5d315054c1503edf2a6c9db3dee"
          new_source = os.environ["SOURCE_COMMIT"]
          source_count = text.count(old_source)
          if source_count != 1:
              raise SystemExit(f"expected one source-pin match, got {source_count}")
          text = text.replace(old_source, new_source, 1)

          old_geometry = "command=$(printf 'cd %q && HQ_CHOICE_E2E=1"
          new_geometry = "command=$(printf 'cd %q && stty cols 180 rows 55 && HQ_CHOICE_E2E=1"
          geometry_count = text.count(old_geometry)
          if geometry_count != 1:
              raise SystemExit(f"expected one PTY-geometry match, got {geometry_count}")
          text = text.replace(old_geometry, new_geometry, 1)

          path.write_text(text, encoding="utf-8")
          PY
          sha256sum "$tmp/integrate.sh" \
            | tee "$ARTIFACT/integrator-sha256.executed.txt"
          printf '%s\n' \
            'identityGate=base-is-ancestor+exact-source-tree' \
            'sourcePin=SOURCE_COMMIT' \
            'ptyGeometry=180x55' \
            > "$ARTIFACT/helper-fixes.txt"
          chmod 700 "$tmp/integrate.sh"
          "$tmp/integrate.sh"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-e2e-v2-${{ steps.integrate.outputs.commit || github.run_id }}
          path: /tmp/focused-e2e-screenshot-v2
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
