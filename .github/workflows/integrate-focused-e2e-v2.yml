name: integrate focused E2E v2

on:
  push:
    branches:
      - automation/focused-e2e-v2-20260822
  pull_request:
    branches:
      - proof/vim-nix-herdr-oci-current-20260821

permissions:
  contents: write

concurrency:
  group: focused-e2e-v2-20260822
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE: 6fbcdd0147b55975492954405e1f562074ddb9c2
      SOURCE_COMMIT: 4e36f0261147e5d315054c1503edf2a6c9db3dee
      SOURCE_TREE: 89581bef71db5b3bc876d6e37c75204e79e3ae4f
      EXPECTED_HQ: 779a298f4efcff8df60205aaf973cb224388a82b
      FINAL_BRANCH: ux/focused-e2e-screenshot-refactor-20260822
      ARTIFACT: /tmp/focused-e2e-screenshot-v2
      INTEGRATOR_GZ_SHA256: 7a4f77a44165eb28190991ba9d1708a0f2e585ecc74c87d63fce65f37c355cc3
      INTEGRATOR_SHA256: bf83a36736294bf1601f43be2b4142a913ef02ca411246e8377f1879c7fcc6ef

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Install screenshot-only host adapters
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xterm scrot x11-utils

      - id: integrate
        name: Run exact source pin, independent E2Es, and observation-only screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT"
          tmp="$RUNNER_TEMP/focused-e2e-v2-integrator"
          mkdir -p "$tmp"
          base64 --decode proofs/vim-nix/integrate-focused-e2e-v2.sh.gz.b64 > "$tmp/integrate.sh.gz"
          test "$(sha256sum "$tmp/integrate.sh.gz" | cut -d' ' -f1)" = "$INTEGRATOR_GZ_SHA256"
          gzip -dc "$tmp/integrate.sh.gz" > "$tmp/integrate.sh"
          test "$(sha256sum "$tmp/integrate.sh" | cut -d' ' -f1)" = "$INTEGRATOR_SHA256"
          chmod 700 "$tmp/integrate.sh"
          "$tmp/integrate.sh"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-e2e-v2-${{ steps.integrate.outputs.commit || github.run_id }}
          path: /tmp/focused-e2e-screenshot-v2
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
