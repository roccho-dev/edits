name: materialize vim nix related heads

on:
  push:
    branches:
      - proposals
    paths:
      - "proofs/vim-nix/requests/current.json"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build exact related-head snapshot
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/edits-vim-nix-related-heads"
          rm -rf "$out"
          mkdir -p "$out/heads"

          readarray -t selected < <(python3 - <<'PY'
          import json, pathlib, re
          request = json.loads(pathlib.Path('proofs/vim-nix/requests/current.json').read_text(encoding='utf-8'))
          if request.get('schema') != 'edits.vimNixOciProofRequest/1':
              raise SystemExit('unsupported request schema')
          for key in ('commit', 'tree'):
              if not re.fullmatch(r'[0-9a-f]{40}', request.get(key, '')):
                  raise SystemExit(f'invalid {key}')
          if request.get('ref') != 'refs/heads/proof/vim-nix-herdr-oci-current-20260821':
              raise SystemExit('request ref outside bounded branch')
          print(request['commit'])
          print(request['tree'])
          print(request['ref'])
          PY
          )
          selected_commit=${selected[0]}
          selected_tree=${selected[1]}
          selected_ref=${selected[2]}

          branches=(
            proposals
            proof/vim-nix-herdr-oci-20260821
            proof/vim-nix-herdr-oci-current-20260821
            proof/vim-nix-herdr-oci-exec-e5ff3770
            proof/vim-nix-herdr-oci-runner-base-20260821
            proposal/bounded-vim-nix-oci-runner-20260821
            proposal/fix-bounded-vim-nix-oci-runner-20260821
            proposal/hq-vim-oci-proof-job-20260821
            proposal/push-vim-nix-oci-runner-20260821
          )

          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          selected_remote="refs/remotes/origin/${selected_ref#refs/heads/}"
          test "$(git rev-parse "$selected_remote^{commit}")" = "$selected_commit"
          test "$(git rev-parse "$selected_commit^{tree}")" = "$selected_tree"

          refs=()
          : > "$out/HEADS.tsv"
          for branch in "${branches[@]}"; do
            remote="refs/remotes/origin/$branch"
            git show-ref --verify --quiet "$remote"
            sha=$(git rev-parse "$remote^{commit}")
            tree=$(git rev-parse "$sha^{tree}")
            safe=${branch//\//__}
            local_ref="refs/heads/materialized/$safe"
            git update-ref "$local_ref" "$sha"
            refs+=("$local_ref")
            printf '%s\t%s\t%s\n' "$branch" "$sha" "$tree" >> "$out/HEADS.tsv"
            git archive --format=tar --prefix="edits-$safe/" "$sha" | gzip -n > "$out/heads/$safe.tar.gz"
          done

          git bundle create "$out/edits-vim-nix-related-heads.git.bundle" "${refs[@]}"
          git bundle verify "$out/edits-vim-nix-related-heads.git.bundle" > "$out/bundle-verify.txt"

          python3 - "$out" "$selected_commit" "$selected_tree" "${branches[@]}" <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          out = pathlib.Path(sys.argv[1])
          selected_commit, selected_tree = sys.argv[2:4]
          rows = []
          for branch in sys.argv[4:]:
              ref = f'refs/remotes/origin/{branch}'
              sha = subprocess.check_output(['git', 'rev-parse', f'{ref}^{{commit}}'], text=True).strip()
              tree = subprocess.check_output(['git', 'rev-parse', f'{sha}^{{tree}}'], text=True).strip()
              parents = subprocess.check_output(['git', 'rev-list', '--parents', '-n', '1', sha], text=True).split()[1:]
              merge_base = subprocess.check_output(['git', 'merge-base', sha, 'refs/remotes/origin/proposals'], text=True).strip()
              changed = subprocess.check_output(['git', 'diff', '--name-status', merge_base, sha], text=True).splitlines()
              safe = branch.replace('/', '__')
              archive = out / 'heads' / f'{safe}.tar.gz'
              rows.append({
                  'branch': branch,
                  'commit': sha,
                  'tree': tree,
                  'parents': parents,
                  'mergeBaseWithProposals': merge_base,
                  'changedPaths': changed,
                  'archive': f'heads/{archive.name}',
                  'archiveBytes': archive.stat().st_size,
                  'archiveSha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              })
          manifest = {
              'schema': 'edits.vimNixRelatedHeadsSnapshot/1',
              'repository': 'roccho-dev/edits',
              'status': 'PASS',
              'selected': {'commit': selected_commit, 'tree': selected_tree},
              'heads': rows,
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY

          (cd "$out" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$out" && sha256sum --check SHA256SUMS)

      - name: Upload exact related-head snapshot
        uses: actions/upload-artifact@v4
        with:
          name: edits-vim-nix-related-heads
          path: ${{ runner.temp }}/edits-vim-nix-related-heads
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Report run to Issue 74
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 74,
              body: [
                '## Related-head materialization run',
                '',
                `status: \`${{ job.status }}\``,
                `run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `control commit: \`${context.sha}\``
              ].join('\n')
            });

  runtime:
    needs: materialize
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARTIFACT: /tmp/vim-nix-current-runtime
      IMAGE_REF: roccho/vim-nix-herdr-hq-proof:d83bf4c
      OCI_IMAGE_REF: roccho/vim-nix-herdr-hq-proof:oci-d83bf4c
    steps:
      - name: Checkout control revision
        uses: actions/checkout@v4
        with:
          ref: proposals
          fetch-depth: 0
          persist-credentials: false

      - id: request
        name: Resolve exact selected candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          request = json.loads(pathlib.Path('proofs/vim-nix/requests/current.json').read_text(encoding='utf-8'))
          if request.get('schema') != 'edits.vimNixOciProofRequest/1':
              raise SystemExit('unsupported request schema')
          commit = request.get('commit', '')
          tree = request.get('tree', '')
          ref = request.get('ref', '')
          if not re.fullmatch(r'[0-9a-f]{40}', commit): raise SystemExit('invalid commit')
          if not re.fullmatch(r'[0-9a-f]{40}', tree): raise SystemExit('invalid tree')
          if ref != 'refs/heads/proof/vim-nix-herdr-oci-current-20260821':
              raise SystemExit('request ref outside bounded branch')
          with open(sys.argv[1], 'a', encoding='utf-8') as output:
              print(f'commit={commit}', file=output)
              print(f'tree={tree}', file=output)
              print(f'ref={ref}', file=output)
          PY

      - name: Checkout exact selected candidate
        shell: bash
        env:
          SELECTED_COMMIT: ${{ steps.request.outputs.commit }}
          SELECTED_TREE: ${{ steps.request.outputs.tree }}
          SELECTED_REF: ${{ steps.request.outputs.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SELECTED_REF"
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$SELECTED_COMMIT"
          git checkout --detach "$SELECTED_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SELECTED_TREE"
          test -z "$(git status --porcelain=v1)"

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Execute exact Nix, Herdr, Docker, and OCI proof
        shell: bash
        env:
          GITHUB_SHA: ${{ steps.request.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT"
          cat proofs/vim-nix/ci.parts/*.sh > "$RUNNER_TEMP/vim-nix-current-ci.sh"
          chmod 0700 "$RUNNER_TEMP/vim-nix-current-ci.sh"
          "$RUNNER_TEMP/vim-nix-current-ci.sh"

      - name: Preserve exact runtime closure and source
        if: always()
        shell: bash
        env:
          SELECTED_COMMIT: ${{ steps.request.outputs.commit }}
          SELECTED_TREE: ${{ steps.request.outputs.tree }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT/source"
          printf '%s\n' "$SELECTED_COMMIT" > "$ARTIFACT/source/selected-commit.txt"
          printf '%s\n' "$SELECTED_TREE" > "$ARTIFACT/source/selected-tree.txt"
          git bundle create "$ARTIFACT/source/edits-vim-nix-current.git.bundle" HEAD
          git bundle verify "$ARTIFACT/source/edits-vim-nix-current.git.bundle" > "$ARTIFACT/source/bundle-verify.txt"
          python3 - <<'PY'
          import pathlib, zipfile
          out = pathlib.Path(__import__('os').environ['ARTIFACT']) / 'source' / 'edits-vim-nix-current.source.zip'
          paths = [pathlib.Path('proofs/vim-nix'), pathlib.Path('.github/workflows/proof-vim-nix-oci.yml')]
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in paths:
                  if path.is_dir():
                      for item in sorted(path.rglob('*')):
                          if item.is_file(): archive.write(item, item.as_posix())
                  elif path.is_file():
                      archive.write(path, path.as_posix())
          PY
          git status --porcelain=v1 > "$ARTIFACT/source/git-status.txt"

          if test -s "$ARTIFACT/product/store-path.txt"; then
            product=$(cat "$ARTIFACT/product/store-path.txt")
            test -e "$product"
            rm -rf "$ARTIFACT/nix-cache"
            if nix copy --to "file://$ARTIFACT/nix-cache" "$product"; then
              printf 'PASS\n' > "$ARTIFACT/nix-cache-export.txt"
            else
              printf 'FAIL\n' > "$ARTIFACT/nix-cache-export.txt"
            fi
            printf '%s\n' "$product" > "$ARTIFACT/nix-cache-root.txt"
          fi

          (cd "$ARTIFACT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$ARTIFACT" && sha256sum --check SHA256SUMS)

      - name: Upload exact current runtime and partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vim-nix-current-runtime
          path: ${{ runner.temp }}/vim-nix-current-runtime
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Report exact runtime result to Issue 74
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 74,
              body: [
                '## Exact current runtime materialization',
                '',
                `status: \`${{ job.status }}\``,
                `run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `selected commit: \`${{ steps.request.outputs.commit }}\``,
                `selected tree: \`${{ steps.request.outputs.tree }}\``,
                '',
                'The artifact is uploaded even on failure and includes the exact source plus any product closure, Docker archive, OCI archive, and runtime evidence reached before the fail-closed boundary.'
              ].join('\n')
            });
