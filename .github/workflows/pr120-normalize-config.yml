name: apply PR 120 canonical image config fix

"on":
  push:
    branches:
      - proposal/issue-118-complete-ci-release-20260830
    paths:
      - .github/workflows/pr120-normalize-config.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: proposal/issue-118-complete-ci-release-20260830
          fetch-depth: 0

      - name: Apply fail-closed canonical image config comparison
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          def append_once(path: Path, marker: str, addition: str) -> None:
              text = path.read_text(encoding="utf-8")
              if marker in text:
                  raise SystemExit(f"{path}: addition already present: {marker}")
              path.write_text(text.rstrip() + "\n\n" + addition.strip() + "\n", encoding="utf-8")

          candidate = Path("proofs/vim-nix/candidate_ci.py")
          canonical_json = '''def canonical_json(value: Any) -> bytes:
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
          '''
          canonical_config = canonical_json + '''

          def canonical_image_config(config: Mapping[str, Any]) -> dict[str, Any]:
              """Normalize only representation-equivalent explicit UTC timestamp spellings."""
              normalized = json.loads(json.dumps(config))
              if not isinstance(normalized, dict):
                  raise BuildFailure("image config must be an object")

              scopes: list[tuple[str, dict[str, Any]]] = [("created", normalized)]
              history = normalized.get("history") or []
              if not isinstance(history, list):
                  raise BuildFailure("image config history must be an array")
              for index, row in enumerate(history):
                  if not isinstance(row, dict):
                      raise BuildFailure(f"image config history[{index}] must be an object")
                  scopes.append((f"history[{index}].created", row))

              for field, scope in scopes:
                  if "created" not in scope:
                      continue
                  value = scope["created"]
                  if not isinstance(value, str):
                      raise BuildFailure(f"image config {field} must be a string")
                  if value.endswith("+00:00"):
                      scope["created"] = value[:-6] + "Z"
                  elif not value.endswith("Z"):
                      raise BuildFailure(f"image config {field} must use explicit UTC")
              return normalized


          def canonical_image_config_digest(config: Mapping[str, Any]) -> str:
              payload = canonical_json(canonical_image_config(config))
              return "sha256:" + hashlib.sha256(payload).hexdigest()
          '''
          replace_once(candidate, canonical_json, canonical_config)
          replace_once(
              candidate,
              '        "configDigest": f"sha256:{config_hex}",\n',
              '        "configDigest": f"sha256:{config_hex}",\n        "canonicalConfigDigest": canonical_image_config_digest(config),\n',
          )
          replace_once(
              candidate,
              '        "configDigest": config_digest,\n',
              '        "configDigest": config_digest,\n        "canonicalConfigDigest": canonical_image_config_digest(config),\n',
          )
          replace_once(
              candidate,
              '''    if docker_inspection["configDigest"] != oci_inspection["configDigest"]:
                  raise BuildFailure("Docker and OCI config digests differ")
              ''',
              '''    if docker_inspection["canonicalConfigDigest"] != oci_inspection["canonicalConfigDigest"]:
                  raise BuildFailure("Docker and OCI canonical image configs differ")
              ''',
          )
          replace_once(
              candidate,
              '''            "id": docker_inspection["imageId"],
                          "configDigest": docker_inspection["configDigest"],
                          "manifestDigest": docker_inspection["manifestDigest"],
              ''',
              '''            "id": docker_inspection["imageId"],
                          "ociImageId": oci_inspection["imageId"],
                          "configDigest": docker_inspection["configDigest"],
                          "ociConfigDigest": oci_inspection["configDigest"],
                          "canonicalConfigDigest": docker_inspection["canonicalConfigDigest"],
                          "manifestDigest": docker_inspection["manifestDigest"],
                          "ociManifestDigest": oci_inspection["manifestDigest"],
              ''',
          )
          replace_once(
              candidate,
              '''        "imageId": docker_inspection["imageId"],
                      "runner": "pytest",
              ''',
              '''        "imageId": docker_inspection["imageId"],
                      "ociImageId": oci_inspection["imageId"],
                      "canonicalConfigDigest": docker_inspection["canonicalConfigDigest"],
                      "runner": "pytest",
              ''',
          )
          replace_once(
              candidate,
              '''                f"- image ID: `{docker_inspection['imageId']}`",
              ''',
              '''                f"- Docker image ID: `{docker_inspection['imageId']}`",
                              f"- OCI image ID: `{oci_inspection['imageId']}`",
                              f"- canonical image config: `{docker_inspection['canonicalConfigDigest']}`",
              ''',
          )

          archive_test = Path("proofs/vim-nix/tests/test_candidate_archive_unit.py")
          append_once(
              archive_test,
              "test_canonical_config_digest_accepts_only_equivalent_utc_spelling",
              '''def test_canonical_config_digest_accepts_only_equivalent_utc_spelling() -> None:
              docker_config = {
                  "architecture": "amd64",
                  "os": "linux",
                  "created": "1970-01-01T00:00:01+00:00",
                  "history": [{"created": "1970-01-01T00:00:01+00:00", "comment": "same history"}],
                  "config": {"Entrypoint": ["/bin/edits"], "User": "1000:1000"},
                  "rootfs": {"type": "layers", "diff_ids": ["sha256:" + "a" * 64]},
              }
              oci_config = json.loads(json.dumps(docker_config))
              oci_config["created"] = "1970-01-01T00:00:01Z"
              oci_config["history"][0]["created"] = "1970-01-01T00:00:01Z"

              assert MODULE.canonical_json(docker_config) != MODULE.canonical_json(oci_config)
              assert MODULE.canonical_image_config_digest(docker_config) == MODULE.canonical_image_config_digest(oci_config)

              oci_config["config"]["User"] = "0:0"
              assert MODULE.canonical_image_config_digest(docker_config) != MODULE.canonical_image_config_digest(oci_config)


          def test_archive_receipts_expose_raw_and_canonical_config_digests(tmp_path: Path) -> None:
              docker = tmp_path / "candidate.docker.tar"
              oci = tmp_path / "candidate.oci.tar"
              synthetic_docker(docker)
              synthetic_oci(oci)

              docker_receipt = MODULE.inspect_docker_archive(docker)
              oci_receipt = MODULE.inspect_oci_archive(oci)

              assert docker_receipt["configDigest"].startswith("sha256:")
              assert oci_receipt["configDigest"].startswith("sha256:")
              assert docker_receipt["canonicalConfigDigest"] == oci_receipt["canonicalConfigDigest"]
          ''',
          )

          runtime_test = Path("proofs/vim-nix/tests/test_candidate_oci.py")
          replace_once(
              runtime_test,
              '''    for lane, image in image_refs.items():
                  inspected = run_command(
                      ["docker", "image", "inspect", image],
                      log=docker_log_dir / f"{lane}-inspect.log",
                  )
                  rows = json.loads(inspected.stdout)
                  assert len(rows) == 1
                  assert rows[0]["Id"] == build_manifest["image"]["id"]
              ''',
              '''    raw_ids = {
                  build_manifest["image"]["id"],
                  build_manifest["image"]["ociImageId"],
              }
              for lane, image in image_refs.items():
                  inspected = run_command(
                      ["docker", "image", "inspect", image],
                      log=docker_log_dir / f"{lane}-inspect.log",
                  )
                  rows = json.loads(inspected.stdout)
                  assert len(rows) == 1
                  assert rows[0]["Id"] in raw_ids
                  if lane == "docker":
                      assert rows[0]["Id"] == build_manifest["image"]["id"]
              ''',
          )
          replace_once(
              runtime_test,
              '''    assert docker_receipt["configDigest"] == oci_receipt["configDigest"] == build_manifest["image"]["configDigest"]
                  assert docker_receipt["layerDigests"] == oci_receipt["layerDigests"] == build_manifest["image"]["layerDigests"]
              ''',
              '''    image = build_manifest["image"]
              assert docker_receipt["configDigest"] == image["configDigest"]
              assert oci_receipt["configDigest"] == image["ociConfigDigest"]
              assert docker_receipt["canonicalConfigDigest"] == oci_receipt["canonicalConfigDigest"] == image["canonicalConfigDigest"]
              assert docker_receipt["layerDigests"] == oci_receipt["layerDigests"] == image["layerDigests"]
              ''',
          )
          replace_once(
              runtime_test,
              '''def test_runtime_images_have_same_product_contract(
              loaded_images: dict[str, str],
              docker_log_dir: pathlib.Path,
          ) -> None:
              ''',
              '''def test_runtime_images_have_same_product_contract(
              loaded_images: dict[str, str],
              build_manifest: dict[str, object],
              docker_log_dir: pathlib.Path,
          ) -> None:
              ''',
          )
          replace_once(
              runtime_test,
              '''    assert inspected[0]["Id"] == inspected[1]["Id"]
              assert inspected[0]["RootFS"]["Layers"] == inspected[1]["RootFS"]["Layers"]
              ''',
              '''    raw_ids = {
                  build_manifest["image"]["id"],
                  build_manifest["image"]["ociImageId"],
              }
              assert all(row["Id"] in raw_ids for row in inspected)
              assert inspected[0]["Id"] == build_manifest["image"]["id"]
              assert inspected[0]["RootFS"]["Layers"] == inspected[1]["RootFS"]["Layers"]
              ''',
          )
          PY

          rm .github/workflows/pr120-normalize-config.yml
          python -m py_compile proofs/vim-nix/candidate_ci.py proofs/vim-nix/tests/test_candidate_archive_unit.py proofs/vim-nix/tests/test_candidate_oci.py
          git diff --check

      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name roccho
          git config user.email 40359643+roccho-dev@users.noreply.github.com
          git add proofs/vim-nix/candidate_ci.py \
                  proofs/vim-nix/tests/test_candidate_archive_unit.py \
                  proofs/vim-nix/tests/test_candidate_oci.py \
                  .github/workflows/pr120-normalize-config.yml
          git commit -m "fix(oci): compare canonical image configs"
          git push origin HEAD:proposal/issue-118-complete-ci-release-20260830
