name: Proof pinned Vim Nix Herdr HQ OCI handoff

on:
  push:
    branches:
      - proof/vim-nix-herdr-oci-20260821
    paths:
      - .github/workflows/proof-vim-nix-herdr-oci.yml
      - proofs/vim-nix/**
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: vim-nix-herdr-oci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PROOF_DIR: proofs/vim-nix
      EXACT_BASE: d83bf4c4860e02f37d6b41cc54fe8c881af4c779
      ISSUE_NUMBER: "74"
      IMAGE_NAME: vim-nix-herdr-hq
      IMAGE_TAG: d83bf4c4860e
      HANDOFF_SHA256: 6a88215c073a43b82f6e584466b07f6c8265e7d4b48ff5e92acbd14626248d38

    steps:
      - name: Checkout exact proof branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed on source drift
        shell: bash
        run: bash "$GITHUB_WORKSPACE/proofs/vim-nix/ci/fail-closed-on-source-drift.sh"

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Build exact closure and replay offline
        id: closure
        shell: bash
        working-directory: ${{ env.PROOF_DIR }}
        run: bash "$GITHUB_WORKSPACE/proofs/vim-nix/ci/build-exact-closure-and-replay-offline.sh"

      - name: Build Docker archive and OCI projection
        id: image
        shell: bash
        working-directory: ${{ env.PROOF_DIR }}
        env:
          DIST: ${{ steps.closure.outputs.dist }}
        run: bash "$GITHUB_WORKSPACE/proofs/vim-nix/ci/build-docker-archive-and-oci-projection.sh"

      - name: Verify OCI structure and destructive cases
        id: verify
        shell: bash
        env:
          DIST: ${{ steps.closure.outputs.dist }}
          EVIDENCE: ${{ steps.closure.outputs.evidence }}
        run: bash "$GITHUB_WORKSPACE/proofs/vim-nix/ci/verify-oci-structure-and-destructive-cases.sh"

      - name: Execute complete proof from Docker archive
        shell: bash
        env:
          DIST: ${{ steps.closure.outputs.dist }}
          EVIDENCE: ${{ steps.closure.outputs.evidence }}
        run: bash "$GITHUB_WORKSPACE/proofs/vim-nix/ci/execute-complete-proof-from-docker-archive.sh"

      - name: Execute complete proof from OCI projection
        shell: bash
        env:
          DIST: ${{ steps.closure.outputs.dist }}
          EVIDENCE: ${{ steps.closure.outputs.evidence }}
          SKOPEO: ${{ steps.image.outputs.skopeo }}
        run: bash "$GITHUB_WORKSPACE/proofs/vim-nix/ci/execute-complete-proof-from-oci-projection.sh"

      - name: Compare host Docker and OCI semantic receipts
        id: parity
        shell: bash
        env:
          EVIDENCE: ${{ steps.closure.outputs.evidence }}
        run: bash "$GITHUB_WORKSPACE/proofs/vim-nix/ci/compare-host-docker-and-oci-semantic-receipts.sh"

      - name: Build downloadable WSLC test pack
        id: pack
        shell: bash
        env:
          DIST: ${{ steps.closure.outputs.dist }}
          EVIDENCE: ${{ steps.closure.outputs.evidence }}
          CLOSURE_BYTES: ${{ steps.closure.outputs.closure_bytes }}
          SEMANTIC_SHA: ${{ steps.parity.outputs.semantic_sha }}
          MANIFEST_DIGEST: ${{ steps.verify.outputs.manifest_digest }}
          CONFIG_DIGEST: ${{ steps.verify.outputs.config_digest }}
        run: bash "$GITHUB_WORKSPACE/proofs/vim-nix/ci/build-downloadable-wslc-test-pack.sh"

      - name: Upload complete proof artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: vim-nix-herdr-hq-wslc-test-${{ github.sha }}
          path: ${{ steps.pack.outputs.release }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish exact-tag prerelease and independently read it back
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ steps.pack.outputs.release }}
          RELEASE_TAG: ${{ steps.pack.outputs.release_tag }}
        run: bash "$GITHUB_WORKSPACE/proofs/vim-nix/ci/publish-exact-tag-prerelease-and-independently-read-it-back.sh"

      - name: Return proof result to Issue 74
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          RELEASE_URL: ${{ steps.publish.outputs.url }}
          SEMANTIC_SHA: ${{ steps.parity.outputs.semantic_sha }}
          PACK_SHA: ${{ steps.pack.outputs.pack_sha }}
        run: bash "$GITHUB_WORKSPACE/proofs/vim-nix/ci/return-proof-result-to-issue-74.sh"
