name: repair focused E2E helper workflow

on:
  push:
    branches:
      - automation/repair-focused-e2e-20260822

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: automation/focused-e2e-screenshot-refactor-20260822
      EXPECTED_HEAD: 257dcfaf538f304bb3cf73662acf2ba02401c776
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Replace the invalid job-level runner context only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/integrate-focused-e2e-screenshot.yml')
          text = path.read_text()
          old = '      ARTIFACT: $' + '{{ runner.temp }}/focused-e2e-screenshot'
          new = '      ARTIFACT: /tmp/focused-e2e-screenshot'
          if text.count(old) != 1:
              raise SystemExit(f'expected one replacement, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          test "$(git diff --name-only | tr -d '\n')" = '.github/workflows/integrate-focused-e2e-screenshot.yml'
          git diff --check
          git config user.name roccho
          git config user.email 40359643+roccho-dev@users.noreply.github.com
          git add .github/workflows/integrate-focused-e2e-screenshot.yml
          git commit -m 'ci: use a valid job-level evidence path'
          new_head=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          gh pr comment 100 --repo "$GITHUB_REPOSITORY" --body \
            "Repaired only the invalid job-level runner context. New helper head: \`$new_head\`. The bounded integration workflow has restarted."
