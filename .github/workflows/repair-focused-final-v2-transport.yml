name: repair focused final v2 patch transport

on:
  push:
    branches: [automation/merge-focused-e2e-20260823]
  pull_request:
    branches: [proposals]

permissions:
  contents: write

concurrency:
  group: repair-focused-final-v2-patch-20260823
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'push' || github.head_ref == 'automation/merge-focused-e2e-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/merge-focused-e2e-20260823
          fetch-depth: 0
          persist-credentials: true

      - name: Remove one transport-only leading space and repin its blob
        shell: bash
        run: |
          set -euo pipefail
          patch=proofs/vim-nix/focused-final-simplify-observer.patch
          workflow=.github/workflows/verify-focused-final-v2.yml

          python3 - "$patch" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = '\n diff --git a/packages/hq-vim/internal/smoke/smoke.go '
          new = '\ndiff --git a/packages/hq-vim/internal/smoke/smoke.go '
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('unexpected focused patch separator')
          PY

          blob=$(git hash-object "$patch")
          python3 - "$workflow" "$blob" <<'PY'
          from pathlib import Path
          import re
          import sys
          path = Path(sys.argv[1])
          blob = sys.argv[2]
          text = path.read_text(encoding='utf-8')
          text2, count = re.subn(
              r'(?m)^      PATCH_BLOB: [0-9a-f]{40}$',
              f'      PATCH_BLOB: {blob}',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one PATCH_BLOB line, got {count}')
          path.write_text(text2, encoding='utf-8')
          PY

          git diff --check
          git config user.name roccho
          git config user.email 40359643+roccho-dev@users.noreply.github.com
          git add "$patch" "$workflow"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: repair focused patch separator and blob pin'
          printf 'REPAIR_COMMIT=%s\nPATCH_BLOB=%s\n' "$(git rev-parse HEAD)" "$blob"
          git push origin HEAD:automation/merge-focused-e2e-20260823
