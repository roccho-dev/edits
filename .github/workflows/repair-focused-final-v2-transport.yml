name: repair focused final v2 transport pin

on:
  push:
    branches: [automation/merge-focused-e2e-20260823]

permissions:
  contents: write

concurrency:
  group: repair-focused-final-v2-transport-20260823
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/merge-focused-e2e-20260823
          fetch-depth: 0
          persist-credentials: true

      - name: Pin helper patch by Git blob identity
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/verify-focused-final-v2.yml
          python3 - "$workflow" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old_env = '      PATCH_SHA256: 225860b0140be105e61243147abb8b47de2a8d85df04125b7c858b21b07e62c8\n'
          new_env = '      PATCH_BLOB: 3ba2bde7e4d9609425be5aac41925a4ad9b80d91\n'
          old_check = '          test "$(sha256sum "$PATCH" | cut -d\' \' -f1)" = "$PATCH_SHA256"\n'
          new_check = '          test "$(git rev-parse "HEAD:$PATCH")" = "$PATCH_BLOB"\n'

          if old_env in text and old_check in text:
              text = text.replace(old_env, new_env, 1).replace(old_check, new_check, 1)
              path.write_text(text, encoding='utf-8')
          elif new_env in text and new_check in text:
              raise SystemExit(0)
          else:
              raise SystemExit('unexpected focused-final-v2 transport shape')
          PY

          if git diff --quiet; then
            exit 0
          fi
          test "$(git diff --name-only | tr -d '\n')" = "$workflow"
          git diff --check
          git config user.name roccho
          git config user.email 40359643+roccho-dev@users.noreply.github.com
          git add "$workflow"
          git commit -m 'ci: pin focused observer patch by Git blob'
          git push origin HEAD:automation/merge-focused-e2e-20260823
