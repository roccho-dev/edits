name: run focused owned boundaries v11

on:
  push:
    branches:
      - automation/focused-owned-boundaries-20260823
    paths:
      - proofs/focused-owned-boundaries-v11.trigger

permissions:
  contents: write

concurrency:
  group: run-focused-owned-boundaries-v11
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE: 05f10d7105682f2346f8f741fa609af3faf33ee1
      V10: ff08af376eaa36c13262068f90a3ebd1eab5dfdf
      SOURCE_BRANCH: ux/focused-e2e-merge-source-v11-20260823
      FINAL_BRANCH: ux/focused-e2e-merge-final-v11-20260823
      EXPECTED_HQ: 779a298f4efcff8df60205aaf973cb224388a82b
      EVIDENCE: /tmp/focused-e2e-owned-boundaries-v11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.V10 }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false

      - id: source
        name: Materialize final focused source A
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"/{source,product,e2e,runtime}
          test "$(git rev-parse HEAD)" = "$V10"
          test "$(git rev-parse HEAD^)" = "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/hq-vim/hq_vim_smoke_test.go')
          s = p.read_text(encoding='utf-8')
          old = '\t\tdocumentationPopup: true,\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected one duplicate popup assertion owner, got {s.count(old)}')
          p.write_text(s.replace(old, '', 1), encoding='utf-8')
          PY
          gofmt -w packages/hq-vim/hq_vim_smoke_test.go
          git diff --check
          test "$(git diff --name-only "$V10" | tr -d '\n')" = packages/hq-vim/hq_vim_smoke_test.go
          (cd packages/hq-vim && go test ./... -count=1) | tee "$EVIDENCE/source/go-test.log"
          mapfile -t focused < <(grep -Rh '^func Test' packages/hq-vim --include='*_test.go' | sed -E 's/^func (Test[^ (]+).*/\1/' | sort)
          expected=(TestAcceptedSubmitKeepsDraftOnUnsafeConsumption TestAgentDecisionSubmitE2E TestAgentDefaultChoiceE2E TestAgentPromptFieldChoiceE2E TestDirectCommandSubmitE2E TestDirectFallbackChoiceE2E TestEditorSurfaceAndBindingFailClosed TestUnicodeDirectFieldValueE2E)
          test "${focused[*]}" = "${expected[*]}"
          for removed in packages/hq-vim/internal/smoke/tty_test.go proofs/vim-nix/hq-vim-native-popup-proof.patch tools/vim-nix-local/feedkeys-race.vim; do test ! -e "$removed"; done
          test -z "$(git diff --name-only "$BASE" | grep -F '.github/workflows/' || true)"
          test -z "$(git diff --name-only "$BASE" | grep -Fx proofs/vim-nix/run.trigger || true)"
          test -z "$(git diff --name-only "$BASE" | grep -E '\.(png|jpe?g|webp)$' || true)"
          git add packages/hq-vim/hq_vim_smoke_test.go
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME=roccho GIT_AUTHOR_EMAIL=40359643+roccho-dev@users.noreply.github.com
          export GIT_COMMITTER_NAME=roccho GIT_COMMITTER_EMAIL=40359643+roccho-dev@users.noreply.github.com
          export GIT_AUTHOR_DATE=2026-08-23T00:00:00Z GIT_COMMITTER_DATE=2026-08-23T00:00:00Z
          source=$(printf '%s\n' 'refactor(hq-vim): keep focused E2Es on owned UX boundaries' | git commit-tree "$tree" -p "$BASE")
          test "$(git rev-parse "$source^")" = "$BASE"
          printf 'base=%s\nv10=%s\nsource=%s\ntree=%s\n' "$BASE" "$V10" "$source" "$tree" | tee "$EVIDENCE/source/identity.txt"
          git diff --name-status "$BASE" "$source" > "$EVIDENCE/source/change-paths.txt"
          ! git ls-remote --exit-code --heads origin "$SOURCE_BRANCH" >/dev/null 2>&1
          git push origin "$source:refs/heads/$SOURCE_BRANCH"
          echo "commit=$source" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - id: proof
        name: Pin exact source A in proof commit B
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          python3 - "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import sys
          commit = sys.argv[1]
          flake = Path('proofs/vim-nix/flake.nix')
          text = flake.read_text(encoding='utf-8')
          needle = '  inputs = {\n'
          insert = '  inputs = {\n    editsSource = {\n      url = "github:roccho-dev/edits/' + commit + '";\n      flake = false;\n    };\n'
          if text.count(needle) != 1:
              raise SystemExit('unexpected flake inputs shape')
          flake.write_text(text.replace(needle, insert, 1), encoding='utf-8')
          part = Path('proofs/vim-nix/flake.parts/00.nix')
          text = part.read_text(encoding='utf-8')
          old_src = '      edits-src = self.outPath;'
          new_src = '      edits-src = inputs.editsSource.outPath;'
          old_rev = '      editsRevision = if self ? rev then self.rev else if self ? dirtyRev then self.dirtyRev else "dirty";'
          new_rev = '      editsRevision = if inputs.editsSource ? rev then inputs.editsSource.rev else "unknown";'
          if text.count(old_src) != 1 or text.count(old_rev) != 1:
              raise SystemExit('unexpected source identity shape')
          part.write_text(text.replace(old_src, new_src, 1).replace(old_rev, new_rev, 1), encoding='utf-8')
          PY
          pushd proofs/vim-nix >/dev/null
          nix flake lock --update-input editsSource
          popd >/dev/null
          test "$(jq -r '.nodes.editsSource.locked.rev' proofs/vim-nix/flake.lock)" = "$SOURCE_COMMIT"
          test "$(jq -r '.nodes.hq.locked.rev' proofs/vim-nix/flake.lock)" = "$EXPECTED_HQ"
          git add proofs/vim-nix/flake.nix proofs/vim-nix/flake.parts/00.nix proofs/vim-nix/flake.lock
          git diff --cached --check -- . ':(exclude)proofs/vim-nix/yegappan-lsp-unicode.patch'
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME=roccho GIT_AUTHOR_EMAIL=40359643+roccho-dev@users.noreply.github.com
          export GIT_COMMITTER_NAME=roccho GIT_COMMITTER_EMAIL=40359643+roccho-dev@users.noreply.github.com
          export GIT_AUTHOR_DATE=2026-08-23T00:00:01Z GIT_COMMITTER_DATE=2026-08-23T00:00:01Z
          proof=$(printf '%s\n' 'proof(vim-nix): pin exact focused E2E source' | git commit-tree "$tree" -p "$SOURCE_COMMIT")
          git checkout --detach "$proof"
          test "$(git rev-parse HEAD^)" = "$SOURCE_COMMIT"
          printf 'source=%s\nproof=%s\ntree=%s\n' "$SOURCE_COMMIT" "$proof" "$tree" | tee "$EVIDENCE/product/proof-identity.txt"
          echo "commit=$proof" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - id: product
        name: Prove normal and offline same product
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          pushd proofs/vim-nix >/dev/null
          before=$(sha256sum flake.lock | cut -d' ' -f1)
          product=$(nix build --no-link --print-out-paths .#default)
          offline=$(nix build --offline --no-write-lock-file --no-link --print-out-paths .#default)
          after=$(sha256sum flake.lock | cut -d' ' -f1)
          popd >/dev/null
          test "$product" = "$offline"
          test "$before" = "$after"
          jq -e --arg source "$SOURCE_COMMIT" '.editsRevision == $source' "$product/share/proof/source.json" >/dev/null
          printf '%s\n' "$product" | tee "$EVIDENCE/product/store-path.txt"
          cp "$product/share/proof/source.json" "$EVIDENCE/product/source.json"
          echo "path=$product" >> "$GITHUB_OUTPUT"

      - name: Eight independent exact-product editor E2Es
        shell: bash
        env:
          PROOF: ${{ steps.product.outputs.path }}
        run: |
          set -euo pipefail
          export HQ_BIN="$PROOF/bin/hq" VIM_EXE="$PROOF/bin/vim" VIM9_LSP_PATH="$PROOF/share/yegappan-lsp" VIMRUNTIME="$PROOF/share/vim/vim92" LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=xterm-256color
          for t in TestAgentDefaultChoiceE2E TestAgentPromptFieldChoiceE2E TestDirectFallbackChoiceE2E TestUnicodeDirectFieldValueE2E; do
            cmd=$(printf 'cd %q && stty cols 180 rows 55 && HQ_CHOICE_E2E=1 HQ_BIN=%q VIM_EXE=%q VIM9_LSP_PATH=%q VIMRUNTIME=%q LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=xterm-256color %q -test.v -test.count=1 -test.run %q' "$PROOF/share/hq-vim" "$HQ_BIN" "$VIM_EXE" "$VIM9_LSP_PATH" "$VIMRUNTIME" "$PROOF/bin/hq-vim.test" "^${t}$")
            timeout 90s script -qefc "$cmd" "$EVIDENCE/e2e/${t}.typescript" | tee "$EVIDENCE/e2e/${t}.log"
            grep -F -- "--- PASS: $t" "$EVIDENCE/e2e/${t}.log" >/dev/null
          done
          for t in TestEditorSurfaceAndBindingFailClosed TestAgentDecisionSubmitE2E TestDirectCommandSubmitE2E TestAcceptedSubmitKeepsDraftOnUnsafeConsumption; do
            (cd "$PROOF/share/hq-vim" && "$PROOF/bin/hq-vim.test" -test.v -test.count=1 -test.run "^${t}$") | tee "$EVIDENCE/e2e/${t}.log"
            grep -F -- "--- PASS: $t" "$EVIDENCE/e2e/${t}.log" >/dev/null
          done

      - name: Independent Herdr worker lifecycle E2E
        shell: bash
        env:
          PROOF_ROOT: ${{ steps.product.outputs.path }}
        run: |
          set -euo pipefail
          cat proofs/vim-nix/run-proof.parts/*.sh > "$RUNNER_TEMP/runtime-proof.sh"
          chmod 700 "$RUNNER_TEMP/runtime-proof.sh"
          PROOF_OUTPUT_DIR="$EVIDENCE/runtime" PROOF_RUNTIME_DIR="$RUNNER_TEMP/runtime" PROOF_RUN_SUFFIX=v11 "$RUNNER_TEMP/runtime-proof.sh" | tee "$EVIDENCE/runtime/stdout.log"
          jq -e '.status == "PASS" and .gates.resultKinds == ["accepted", "started", "stdout", "completed"] and .gates.residualProcessCount == 0' "$EVIDENCE/runtime/receipt.json" >/dev/null

      - name: Push verified final proof branch
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          PROOF_COMMIT: ${{ steps.proof.outputs.commit }}
        run: |
          set -euo pipefail
          ! git ls-remote --exit-code --heads origin "$FINAL_BRANCH" >/dev/null 2>&1
          git push origin "$PROOF_COMMIT:refs/heads/$FINAL_BRANCH"
          jq -n --arg base "$BASE" --arg source "$SOURCE_COMMIT" --arg sourceTree '${{ steps.source.outputs.tree }}' --arg proof "$PROOF_COMMIT" --arg proofTree '${{ steps.proof.outputs.tree }}' --arg product '${{ steps.product.outputs.path }}' '{schema:"edits.focused-e2e-owned-boundaries/2",status:"PASS",base:$base,sourceCommit:$source,sourceTree:$sourceTree,proofCommit:$proof,proofTree:$proofTree,productStorePath:$product,editorBehaviorE2Es:8,runtimeLifecycleE2Es:1,documentationContract:"native completion item metadata",resultKinds:["accepted","started","stdout","completed"],residualProcessCount:0,screenshotsPushed:false,e2eComposition:false}' > "$EVIDENCE/receipt.json"
          (cd "$EVIDENCE" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum --check SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-owned-boundaries-v11-${{ github.run_id }}
          path: /tmp/focused-e2e-owned-boundaries-v11
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
