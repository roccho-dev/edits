name: run focused owned boundaries v20

on:
  push:
    branches:
      - automation/focused-owned-boundaries-20260823
    paths:
      - proofs/run-focused-owned-boundaries-v20.trigger

permissions:
  contents: write

concurrency:
  group: focused-owned-boundaries-v20
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/focused-owned-boundaries-20260823
          fetch-depth: 0
          persist-credentials: true
      - name: Derive exact v20 helper from v17
        shell: bash
        run: |
          set -euo pipefail
          cp proofs/focused-owned-boundaries-v17.sh "$RUNNER_TEMP/focused-owned-boundaries-v20.sh"
          python3 - "$RUNNER_TEMP/focused-owned-boundaries-v20.sh" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          s = s.replace('v17', 'v20').replace('V17', 'V20').replace('20260823', '20260824')
          old_new = "new = '    feedkeys(\"\\\\<C-G>u\", \\'nt\\')\\n'"
          new_new = "new = '    feedkeys(\"\\\\<C-G>u\", \\'in\\')\\n'"
          if s.count(old_new) != 1:
              raise SystemExit(f'v20 feedkeys replacement matches={s.count(old_new)}')
          s = s.replace(old_new, new_new, 1)
          old_write = "p.write_text(s.replace(old, new, 1), encoding='utf-8')"
          new_write = """s = s.replace(old, new, 1)
          timer_old = '  timer_start(0, (_) => CompletionUndoApply())\\n'
          timer_new = '  CompletionUndoApply()\\n'
          if s.count(timer_old) != 1:
              raise SystemExit(f'v20 timer replacement matches={s.count(timer_old)}')
          s = s.replace(timer_old, timer_new, 1)
          p.write_text(s, encoding='utf-8')"""
          if s.count(old_write) != 1:
              raise SystemExit(f'v20 embedded writer matches={s.count(old_write)}')
          s = s.replace(old_write, new_write, 1)
          s = s.replace('fix(hq-vim): queue typed completion undo boundary', 'fix(hq-vim): place completion undo boundary before selection')
          p.write_text(s, encoding='utf-8')
          PY
          chmod 700 "$RUNNER_TEMP/focused-owned-boundaries-v20.sh"
          grep -F "timer_new = '  CompletionUndoApply()" "$RUNNER_TEMP/focused-owned-boundaries-v20.sh"
          grep -F "feedkeys(\"\\\\<C-G>u\", \\'in\\')" "$RUNNER_TEMP/focused-owned-boundaries-v20.sh"
          git checkout --detach d8428a49529faa3394d202b25a42719acb627181
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true
      - name: Run exact pre-selection undo proof
        shell: bash
        env:
          EVIDENCE: /tmp/focused-e2e-owned-boundaries-v20
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/focused-owned-boundaries-v20.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-owned-boundaries-v20-${{ github.run_id }}
          path: /tmp/focused-e2e-owned-boundaries-v20
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
