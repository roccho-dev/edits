name: run exact focused v24 verification

on:
  push:
    branches:
      - automation/focused-owned-boundaries-20260823
    paths:
      - proofs/run-focused-v24.trigger

permissions:
  contents: write

concurrency:
  group: focused-v24-final
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/focused-owned-boundaries-20260823
          fetch-depth: 0
          persist-credentials: true
      - name: Preserve verifier then checkout exact v24 source
        shell: bash
        run: |
          set -euo pipefail
          cp proofs/verify-focused-v24.sh "$RUNNER_TEMP/verify-focused-v24.sh"
          python3 - "$RUNNER_TEMP/verify-focused-v24.sh" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          old = 'git diff --check "$BASE" "$SOURCE"\n'
          new = 'git diff --check "$BASE" "$SOURCE" -- . \' :(exclude)proofs/vim-nix/yegappan-lsp-unicode.patch\'\n'.replace("' :", "':")
          if s.count(old) != 1:
              raise SystemExit(f'diff-check gate matches={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          chmod 700 "$RUNNER_TEMP/verify-focused-v24.sh"
          grep -F "yegappan-lsp-unicode.patch" "$RUNNER_TEMP/verify-focused-v24.sh"
          git checkout --detach 788245e5a19b40f6392511c28297227ccb2e8f30
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true
      - name: Verify exact v24 source end-to-end
        shell: bash
        env:
          EVIDENCE: /tmp/focused-e2e-v24
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/verify-focused-v24.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-v24-${{ github.run_id }}
          path: /tmp/focused-e2e-v24
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
