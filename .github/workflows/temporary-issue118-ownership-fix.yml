name: temporary issue118 ownership fix

on:
  push:
    branches:
      - proposal/issue-118-complete-ci-release-20260830

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: proposal/issue-118-complete-ci-release-20260830
          fetch-depth: 0

      - name: Apply fake-root ownership and archive metadata gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          nix_path = Path('proofs/vim-nix/flake.parts/01.nix')
          nix_text = nix_path.read_text(encoding='utf-8')
          old_nix = '''        extraCommands = ''
                    mkdir -p home/dev work/repos tmp
                    chown -R 1000:1000 home/dev work/repos
                    chmod 0700 home/dev
                    chmod 0755 work work/repos
                    chmod 1777 tmp
                  '';
          '''
          new_nix = '''        extraCommands = ''
                    mkdir -p home/dev work/repos tmp
                    chmod 0700 home/dev
                    chmod 0755 work work/repos
                    chmod 1777 tmp
                  '';
                  fakeRootCommands = ''
                    chown -R 1000:1000 ./home/dev ./work/repos
                  '';
          '''
          if old_nix not in nix_text:
              raise SystemExit('expected interactive image ownership block was not found')
          nix_path.write_text(nix_text.replace(old_nix, new_nix, 1), encoding='utf-8')

          candidate_path = Path('proofs/vim-nix/candidate_ci.py')
          candidate = candidate_path.read_text(encoding='utf-8')
          anchor = 'def inspect_docker_archive(path: pathlib.Path) -> dict[str, Any]:\n'
          if anchor not in candidate:
              raise SystemExit('candidate archive inspection anchor was not found')
          helper = r'''CANDIDATE_ROOTFS_EXPECTED: dict[str, dict[str, object]] = {
              "home/dev": {"uid": 1000, "gid": 1000, "mode": "0700", "type": "directory"},
              "work/repos": {"uid": 1000, "gid": 1000, "mode": "0755", "type": "directory"},
          }


          def _normalized_layer_path(name: str) -> str:
              normalized = name.replace("\\", "/").lstrip("./").lstrip("/").rstrip("/")
              return str(pathlib.PurePosixPath(normalized)) if normalized else ""


          def _archive_layer_paths(archive: tarfile.TarFile, archive_format: str) -> list[str]:
              if archive_format == "docker":
                  manifest = tar_json(archive, "manifest.json")
                  if not isinstance(manifest, list) or len(manifest) != 1:
                      raise BuildFailure("Docker archive must contain exactly one image for rootfs inspection")
                  paths = manifest[0].get("Layers") or []
                  if not all(isinstance(value, str) for value in paths):
                      raise BuildFailure("Docker archive layer paths are invalid")
                  return list(paths)
              if archive_format == "oci":
                  index = tar_json(archive, "index.json")
                  descriptors = index.get("manifests") or []
                  if len(descriptors) != 1:
                      raise BuildFailure("OCI archive must contain exactly one image for rootfs inspection")
                  digest = descriptors[0].get("digest")
                  if not isinstance(digest, str) or not digest.startswith("sha256:"):
                      raise BuildFailure("OCI archive manifest digest is invalid for rootfs inspection")
                  manifest = tar_json(archive, f"blobs/sha256/{digest.split(':', 1)[1]}")
                  result: list[str] = []
                  for layer in manifest.get("layers") or []:
                      layer_digest = layer.get("digest")
                      if not isinstance(layer_digest, str) or not layer_digest.startswith("sha256:"):
                          raise BuildFailure("OCI archive layer digest is invalid for rootfs inspection")
                      result.append(f"blobs/sha256/{layer_digest.split(':', 1)[1]}")
                  return result
              raise BuildFailure(f"unsupported rootfs archive format: {archive_format}")


          def inspect_archive_rootfs_metadata(path: pathlib.Path, *, archive_format: str) -> dict[str, dict[str, object]]:
              metadata: dict[str, dict[str, object]] = {}
              targets = set(CANDIDATE_ROOTFS_EXPECTED)
              with tarfile.open(path, "r:*") as outer:
                  for layer_path in _archive_layer_paths(outer, archive_format):
                      layer_stream = outer.extractfile(layer_path)
                      if layer_stream is None:
                          raise BuildFailure(f"archive layer is missing: {layer_path}")
                      with tarfile.open(fileobj=layer_stream, mode="r|*") as layer:
                          for member in layer:
                              normalized = _normalized_layer_path(member.name)
                              if not normalized:
                                  continue
                              pure = pathlib.PurePosixPath(normalized)
                              if pure.name.startswith(".wh."):
                                  removed = str(pure.parent / pure.name.removeprefix(".wh."))
                                  metadata.pop(removed, None)
                                  continue
                              if normalized not in targets:
                                  continue
                              metadata[normalized] = {
                                  "uid": member.uid,
                                  "gid": member.gid,
                                  "mode": f"{stat.S_IMODE(member.mode):04o}",
                                  "type": "directory" if member.isdir() else "other",
                              }
              return metadata


          def validate_candidate_rootfs_contract(
              runtime: Mapping[str, Any],
              metadata: Mapping[str, Mapping[str, object]],
              mismatches: list[str],
          ) -> None:
              if runtime.get("User") != "1000:1000":
                  mismatches.append("config:User")
              for path, expected in CANDIDATE_ROOTFS_EXPECTED.items():
                  if dict(metadata.get(path) or {}) != expected:
                      mismatches.append(f"rootfs:{path}")


          '''
          candidate = candidate.replace(anchor, helper + anchor, 1)

          docker_anchor = '''    runtime = config.get("config") or {}
              labels = runtime.get("Labels") or {}
              return {
          '''
          docker_replacement = '''    runtime = config.get("config") or {}
              labels = runtime.get("Labels") or {}
              rootfs_metadata = inspect_archive_rootfs_metadata(path, archive_format="docker")
              validate_candidate_rootfs_contract(runtime, rootfs_metadata, mismatches)
              return {
          '''
          if docker_anchor not in candidate:
              raise SystemExit('Docker runtime return anchor was not found')
          candidate = candidate.replace(docker_anchor, docker_replacement, 1)

          oci_anchor = '''    runtime = config.get("config") or {}
              annotations = descriptor.get("annotations") or {}
              return {
          '''
          oci_replacement = '''    runtime = config.get("config") or {}
              annotations = descriptor.get("annotations") or {}
              rootfs_metadata = inspect_archive_rootfs_metadata(path, archive_format="oci")
              validate_candidate_rootfs_contract(runtime, rootfs_metadata, mismatches)
              return {
          '''
          if oci_anchor not in candidate:
              raise SystemExit('OCI runtime return anchor was not found')
          candidate = candidate.replace(oci_anchor, oci_replacement, 1)

          return_anchor = '''        "user": runtime.get("User"),
                  "exposedPorts": len(runtime.get("ExposedPorts") or {}),
          '''
          if candidate.count(return_anchor) != 2:
              raise SystemExit('expected two archive return metadata anchors')
          candidate = candidate.replace(
              return_anchor,
              '''        "user": runtime.get("User"),
                  "rootfsMetadata": rootfs_metadata,
                  "exposedPorts": len(runtime.get("ExposedPorts") or {}),
          ''',
          )
          candidate_path.write_text(candidate, encoding='utf-8')

          test_path = Path('proofs/vim-nix/tests/test_candidate_rootfs_metadata.py')
          test_path.write_text(r'''from __future__ import annotations

          import importlib.util
          import io
          import json
          import pathlib
          import tarfile


          ROOT = pathlib.Path(__file__).resolve().parents[1]
          SPEC = importlib.util.spec_from_file_location("candidate_ci", ROOT / "candidate_ci.py")
          assert SPEC is not None and SPEC.loader is not None
          candidate_ci = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(candidate_ci)


          def _layer_bytes(*, uid: int = 1000, gid: int = 1000) -> bytes:
              payload = io.BytesIO()
              with tarfile.open(fileobj=payload, mode="w:gz") as layer:
                  for name, mode in (("home/dev", 0o700), ("work/repos", 0o755)):
                      member = tarfile.TarInfo(name)
                      member.type = tarfile.DIRTYPE
                      member.uid = uid
                      member.gid = gid
                      member.mode = mode
                      member.mtime = 0
                      layer.addfile(member)
              return payload.getvalue()


          def _docker_archive(path: pathlib.Path, *, uid: int = 1000, gid: int = 1000) -> None:
              layer = _layer_bytes(uid=uid, gid=gid)
              with tarfile.open(path, mode="w") as outer:
                  manifest = json.dumps([{"Layers": ["layers/candidate.tar.gz"]}]).encode()
                  manifest_info = tarfile.TarInfo("manifest.json")
                  manifest_info.size = len(manifest)
                  outer.addfile(manifest_info, io.BytesIO(manifest))
                  layer_info = tarfile.TarInfo("layers/candidate.tar.gz")
                  layer_info.size = len(layer)
                  outer.addfile(layer_info, io.BytesIO(layer))


          def test_archive_rootfs_metadata_matches_runtime_user(tmp_path: pathlib.Path) -> None:
              archive = tmp_path / "candidate.tar"
              _docker_archive(archive)
              metadata = candidate_ci.inspect_archive_rootfs_metadata(archive, archive_format="docker")
              assert metadata == candidate_ci.CANDIDATE_ROOTFS_EXPECTED
              mismatches: list[str] = []
              candidate_ci.validate_candidate_rootfs_contract({"User": "1000:1000"}, metadata, mismatches)
              assert mismatches == []


          def test_archive_rootfs_metadata_rejects_wrong_owner(tmp_path: pathlib.Path) -> None:
              archive = tmp_path / "candidate.tar"
              _docker_archive(archive, uid=0, gid=0)
              metadata = candidate_ci.inspect_archive_rootfs_metadata(archive, archive_format="docker")
              mismatches: list[str] = []
              candidate_ci.validate_candidate_rootfs_contract({"User": "1000:1000"}, metadata, mismatches)
              assert sorted(mismatches) == ["rootfs:home/dev", "rootfs:work/repos"]


          def test_interactive_image_records_ownership_with_fake_root() -> None:
              source = (ROOT / "flake.parts" / "01.nix").read_text(encoding="utf-8")
              interactive = source.split('interactiveImage = pkgs.dockerTools.buildLayeredImage', 1)[1]
              extra = interactive.split("extraCommands = ''", 1)[1].split("'';", 1)[0]
              fake = interactive.split("fakeRootCommands = ''", 1)[1].split("'';", 1)[0]
              assert "chown" not in extra
              assert "chown -R 1000:1000 ./home/dev ./work/repos" in fake
              assert 'User = "1000:1000";' in interactive
          ''', encoding='utf-8')
          PY

      - name: Validate and commit bounded fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile proofs/vim-nix/candidate_ci.py proofs/vim-nix/tests/test_candidate_rootfs_metadata.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temporary-issue118-ownership-fix.yml
          git add proofs/vim-nix/flake.parts/01.nix proofs/vim-nix/candidate_ci.py proofs/vim-nix/tests/test_candidate_rootfs_metadata.py
          git commit -m "fix(nix): record candidate volume ownership with fake root"
          git push origin HEAD:proposal/issue-118-complete-ci-release-20260830
