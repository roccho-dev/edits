name: temporary issue118 test import fix

on:
  push:
    branches:
      - proposal/issue-118-complete-ci-release-20260830

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: proposal/issue-118-complete-ci-release-20260830
          fetch-depth: 0

      - name: Register dynamically loaded candidate module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('proofs/vim-nix/tests/test_candidate_rootfs_metadata.py')
          text = path.read_text(encoding='utf-8')
          if 'import sys\n' not in text:
              text = text.replace('import pathlib\n', 'import pathlib\nimport sys\n', 1)
          old = '''candidate_ci = importlib.util.module_from_spec(SPEC)
          SPEC.loader.exec_module(candidate_ci)
          '''
          new = '''candidate_ci = importlib.util.module_from_spec(SPEC)
          sys.modules[SPEC.name] = candidate_ci
          SPEC.loader.exec_module(candidate_ci)
          '''
          if old not in text:
              raise SystemExit('dynamic import anchor was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile proofs/vim-nix/tests/test_candidate_rootfs_metadata.py
          git diff --check

      - name: Commit bounded test fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temporary-issue118-test-import-fix.yml
          git add proofs/vim-nix/tests/test_candidate_rootfs_metadata.py
          git commit -m "test(nix): harden candidate ownership regression import"
          git push origin HEAD:proposal/issue-118-complete-ci-release-20260830
