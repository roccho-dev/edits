name: verify focused E2E final v2

on:
  push:
    branches: [automation/merge-focused-e2e-20260823]
  pull_request:
    branches: [proposals]

permissions:
  contents: write

concurrency:
  group: focused-e2e-final-v2-20260823
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push' || github.head_ref == 'automation/merge-focused-e2e-20260823'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE: 05f10d7105682f2346f8f741fa609af3faf33ee1
      SEED: 6d12ee46ba86175578933fe146189e2884f6a336
      PATCH: proofs/vim-nix/focused-final-simplify-observer.patch
      PATCH_BLOB: 3ba2bde7e4d9609425be5aac41925a4ad9b80d91
      SOURCE_BRANCH: ux/focused-e2e-merge-source-final-v2-20260823
      FINAL_BRANCH: ux/focused-e2e-merge-final-v3-20260823
      EVIDENCE: /tmp/focused-e2e-final-v2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'

      - id: source
        name: Materialize direct-child source A from exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "HEAD:$PATCH")" = "$PATCH_BLOB"
          cp "$PATCH" "$RUNNER_TEMP/focused-final.patch"
          git checkout --detach "$SEED"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test -z "$(git diff --name-only "$BASE" HEAD | grep -F '.github/workflows/' || true)"
          test -z "$(git diff --name-only "$BASE" HEAD | grep -Fx proofs/vim-nix/run.trigger || true)"
          test -z "$(git diff --name-only "$BASE" HEAD | grep -E '\.(png|jpe?g|webp)$' || true)"
          git apply --check "$RUNNER_TEMP/focused-final.patch"
          git apply --index "$RUNNER_TEMP/focused-final.patch"
          gofmt -w packages/hq-vim/hq_vim_smoke_test.go packages/hq-vim/internal/smoke/smoke.go
          git add packages/hq-vim/hq_vim_smoke_test.go packages/hq-vim/internal/smoke/smoke.go
          git diff --cached --check

          mapfile -t tests < <(grep -Rh '^func Test' packages/hq-vim --include='*_test.go' | sed -E 's/^func (Test[^ (]+).*/\1/' | sort)
          expected=(TestAcceptedSubmitKeepsDraftOnUnsafeConsumption TestAgentDecisionSubmitE2E TestAgentDefaultChoiceE2E TestAgentPromptFieldChoiceE2E TestDirectCommandSubmitE2E TestDirectFallbackChoiceE2E TestEditorSurfaceAndBindingFailClosed TestUnicodeDirectFieldValueE2E)
          test "${tests[*]}" = "${expected[*]}"
          (cd packages/hq-vim && go test ./... -count=1)

          tree=$(git write-tree)
          export GIT_AUTHOR_NAME=roccho GIT_AUTHOR_EMAIL=40359643+roccho-dev@users.noreply.github.com
          export GIT_COMMITTER_NAME=roccho GIT_COMMITTER_EMAIL=40359643+roccho-dev@users.noreply.github.com
          export GIT_AUTHOR_DATE=2026-08-23T00:00:00Z GIT_COMMITTER_DATE=2026-08-23T00:00:00Z
          commit=$(printf '%s\n' 'refactor(hq-vim): separate semantic E2E from PTY observation' | git commit-tree "$tree" -p "$BASE")
          test "$(git rev-parse "$commit^")" = "$BASE"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          printf 'A commit=%s tree=%s\n' "$commit" "$tree"

          if git ls-remote --exit-code --heads origin "$SOURCE_BRANCH" >/dev/null 2>&1; then
            existing=$(git ls-remote --heads origin "$SOURCE_BRANCH" | awk '{print $1}')
            test "$existing" = "$commit"
          else
            git push origin "$commit:refs/heads/$SOURCE_BRANCH"
          fi

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - id: proof
        name: Create proof pin B for exact source A
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_TREE_A: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE_A"
          python3 - "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import sys
          commit = sys.argv[1]

          flake = Path('proofs/vim-nix/flake.nix')
          text = flake.read_text(encoding='utf-8')
          needle = '  inputs = {\n'
          insert = '  inputs = {\n    editsSource = {\n      url = "github:roccho-dev/edits/' + commit + '";\n      flake = false;\n    };\n'
          if text.count(needle) != 1:
              raise SystemExit('unexpected flake inputs shape')
          flake.write_text(text.replace(needle, insert, 1), encoding='utf-8')

          part = Path('proofs/vim-nix/flake.parts/00.nix')
          text = part.read_text(encoding='utf-8')
          old_src = '      edits-src = self.outPath;'
          new_src = '      edits-src = inputs.editsSource.outPath;'
          old_rev = '      editsRevision = if self ? rev then self.rev else if self ? dirtyRev then self.dirtyRev else "dirty";'
          new_rev = '      editsRevision = if inputs.editsSource ? rev then inputs.editsSource.rev else "unknown";'
          if text.count(old_src) != 1 or text.count(old_rev) != 1:
              raise SystemExit('unexpected source identity shape')
          part.write_text(text.replace(old_src, new_src, 1).replace(old_rev, new_rev, 1), encoding='utf-8')
          PY

          pushd proofs/vim-nix >/dev/null
          nix flake lock --update-input editsSource
          popd >/dev/null
          test "$(jq -r '.nodes.editsSource.locked.rev' proofs/vim-nix/flake.lock)" = "$SOURCE_COMMIT"
          git add proofs/vim-nix/flake.nix proofs/vim-nix/flake.parts/00.nix proofs/vim-nix/flake.lock
          git diff --cached --check -- . ':(exclude)proofs/vim-nix/yegappan-lsp-unicode.patch'
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME=roccho GIT_AUTHOR_EMAIL=40359643+roccho-dev@users.noreply.github.com
          export GIT_COMMITTER_NAME=roccho GIT_COMMITTER_EMAIL=40359643+roccho-dev@users.noreply.github.com
          export GIT_AUTHOR_DATE=2026-08-23T00:00:01Z GIT_COMMITTER_DATE=2026-08-23T00:00:01Z
          commit=$(printf '%s\n' 'proof(vim-nix): pin exact focused E2E source' | git commit-tree "$tree" -p "$SOURCE_COMMIT")
          git checkout --detach "$commit"
          test "$(git rev-parse HEAD^)" = "$SOURCE_COMMIT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          printf 'B commit=%s tree=%s\n' "$commit" "$tree"

      - id: product
        name: Build B normally and offline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"/{e2e,runtime,screenshots}
          pushd proofs/vim-nix >/dev/null
          before=$(sha256sum flake.lock | cut -d' ' -f1)
          product=$(nix build --no-link --print-out-paths .#default)
          offline=$(nix build --offline --no-write-lock-file --no-link --print-out-paths .#default)
          after=$(sha256sum flake.lock | cut -d' ' -f1)
          popd >/dev/null
          test "$product" = "$offline"
          test "$before" = "$after"
          jq -e --arg a '${{ steps.source.outputs.commit }}' '.editsRevision == $a' "$product/share/proof/source.json" >/dev/null
          printf '%s\n' "$product" | tee "$EVIDENCE/product-store-path.txt"
          echo "path=$product" >> "$GITHUB_OUTPUT"

      - name: Run eight independent exact-product editor E2Es
        shell: bash
        env:
          PROOF: ${{ steps.product.outputs.path }}
        run: |
          set -euo pipefail
          export HQ_BIN="$PROOF/bin/hq" VIM_EXE="$PROOF/bin/vim" VIM9_LSP_PATH="$PROOF/share/yegappan-lsp" VIMRUNTIME="$PROOF/share/vim/vim92" LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=xterm-256color
          for t in TestAgentDefaultChoiceE2E TestAgentPromptFieldChoiceE2E TestDirectFallbackChoiceE2E TestUnicodeDirectFieldValueE2E; do
            echo "E2E $t"
            cmd=$(printf 'cd %q && stty cols 180 rows 55 && HQ_CHOICE_E2E=1 HQ_BIN=%q VIM_EXE=%q VIM9_LSP_PATH=%q VIMRUNTIME=%q LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=xterm-256color %q -test.v -test.count=1 -test.run %q' "$PROOF/share/hq-vim" "$HQ_BIN" "$VIM_EXE" "$VIM9_LSP_PATH" "$VIMRUNTIME" "$PROOF/bin/hq-vim.test" "^${t}$")
            timeout 90s script -qefc "$cmd" "$EVIDENCE/e2e/$t.typescript" | tee "$EVIDENCE/e2e/$t.log"
            grep -F -- "--- PASS: $t" "$EVIDENCE/e2e/$t.log" >/dev/null
          done
          for t in TestEditorSurfaceAndBindingFailClosed TestAgentDecisionSubmitE2E TestDirectCommandSubmitE2E TestAcceptedSubmitKeepsDraftOnUnsafeConsumption; do
            echo "E2E $t"
            (cd "$PROOF/share/hq-vim" && "$PROOF/bin/hq-vim.test" -test.v -test.count=1 -test.run "^${t}$") | tee "$EVIDENCE/e2e/$t.log"
            grep -F -- "--- PASS: $t" "$EVIDENCE/e2e/$t.log" >/dev/null
          done

      - name: Run independent Herdr worker lifecycle E2E
        shell: bash
        env:
          PROOF_ROOT: ${{ steps.product.outputs.path }}
        run: |
          set -euo pipefail
          cat proofs/vim-nix/run-proof.parts/*.sh > "$RUNNER_TEMP/runtime-proof.sh"
          chmod 700 "$RUNNER_TEMP/runtime-proof.sh"
          PROOF_OUTPUT_DIR="$EVIDENCE/runtime" PROOF_RUNTIME_DIR="$RUNNER_TEMP/runtime" PROOF_RUN_SUFFIX=merge "$RUNNER_TEMP/runtime-proof.sh"
          jq -e '.status == "PASS" and .gates.resultKinds == ["accepted","started","stdout","completed"] and .gates.residualProcessCount == 0' "$EVIDENCE/runtime/receipt.json" >/dev/null

      - name: Install screenshot-only host adapters
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xterm scrot x11-utils

      - name: Capture three observation-only PTY screenshots
        shell: bash
        env:
          PROOF_ROOT: ${{ steps.product.outputs.path }}
          PTY_CAPTURE_OUT: /tmp/focused-e2e-final-v2/screenshots
        run: |
          set -euo pipefail
          bash proofs/vim-nix/capture-pty-e2e.sh | tee "$EVIDENCE/screenshots.log"
          jq -e '.status == "PASS" and .captureAddsBehavior == false and .e2eComposition == false and (.screenshots | length) == 3' "$EVIDENCE/screenshots/receipt.json" >/dev/null

      - name: Write proof receipt and exact Git bundle
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
          FINAL_COMMIT: ${{ steps.proof.outputs.commit }}
          FINAL_TREE: ${{ steps.proof.outputs.tree }}
          PROOF: ${{ steps.product.outputs.path }}
        run: |
          set -euo pipefail
          git update-ref refs/heads/focused-final-v2-evidence "$FINAL_COMMIT"
          git bundle create "$EVIDENCE/edits-focused-final.git.bundle" refs/heads/focused-final-v2-evidence
          git bundle verify "$EVIDENCE/edits-focused-final.git.bundle" > "$EVIDENCE/bundle-verify.txt"
          git update-ref -d refs/heads/focused-final-v2-evidence
          jq -n --arg base "$BASE" --arg source "$SOURCE_COMMIT" --arg sourceTree "$SOURCE_TREE" --arg final "$FINAL_COMMIT" --arg finalTree "$FINAL_TREE" --arg product "$PROOF" '{schema:"edits.focused-e2e-final/2",status:"PASS",base:$base,sourceCommit:$source,sourceTree:$sourceTree,finalCommit:$final,finalTree:$finalTree,productStorePath:$product,editorBehaviorE2Es:8,runtimeLifecycleE2Es:1,screenshotCount:3,screenshotMechanism:"observation-only",e2eComposition:false,normalOfflineSameStorePath:true}' > "$EVIDENCE/receipt.json"
          (cd "$EVIDENCE" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$EVIDENCE" && sha256sum --check SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: focused-e2e-final-v2-${{ steps.proof.outputs.commit }}
          path: /tmp/focused-e2e-final-v2
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Push verified final branch only after every gate passes
        shell: bash
        env:
          FINAL_COMMIT: ${{ steps.proof.outputs.commit }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$FINAL_BRANCH" >/dev/null 2>&1; then
            existing=$(git ls-remote --heads origin "$FINAL_BRANCH" | awk '{print $1}')
            test "$existing" = "$FINAL_COMMIT"
          else
            git push origin "$FINAL_COMMIT:refs/heads/$FINAL_BRANCH"
          fi
