name: verify focused owned boundaries

on:
  pull_request:
    branches: [proposals]

permissions:
  contents: write

concurrency:
  group: focused-owned-boundaries-20260823
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE: 05f10d7105682f2346f8f741fa609af3faf33ee1
      SEED: 3c53a8378112c4e017ae3ad3ca5bf5c49a664fce
      SOURCE_BRANCH: ux/focused-e2e-merge-source-v8-20260823
      FINAL_BRANCH: ux/focused-e2e-merge-final-v8-20260823
      EXPECTED_HQ: 779a298f4efcff8df60205aaf973cb224388a82b
      EVIDENCE: /tmp/focused-e2e-owned-boundaries
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SEED }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false

      - id: source
        name: Materialize focused owner-boundary source A
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"/{source,product,e2e,runtime}
          test "$(git rev-parse HEAD)" = "$SEED"
          test "$(git rev-parse HEAD^)" = "$BASE"

          python3 - <<'PY'
          from pathlib import Path

          smoke = Path('packages/hq-vim/internal/smoke/smoke.go')
          s = smoke.read_text(encoding='utf-8')
          old = '''\tExpectedCompletionLabel string
\tExpectedCompletionText  string
\tNativePopupFileFormat   string'''
          new = '''\tExpectedCompletionLabel    string
\tExpectedCompletionText     string
\tRequireDocumentationPopup bool
\tNativePopupFileFormat      string'''
          if s.count(old) != 1:
              raise SystemExit('unexpected Config completion fields')
          s = s.replace(old, new, 1)

          old = '''\tif cfg.CaptureReadyPath != "" {
\t\tlines = append(lines,
\t\t\t"function! HqNativePopupCaptureWait(timer) abort",
\t\t\t"  if filereadable("+vimString(cfg.CaptureDonePath)+")",
\t\t\t`    call feedkeys("\\<C-Y>\\<Esc>", 'n')`,
\t\t\t"    call timer_start(100, function('HqNativePopupVerify'))",
\t\t\t"    return",
\t\t\t"  endif",
\t\t\t"  if reltimefloat(reltime()) >= g:hq_native_deadline",
\t\t\t"    call HqNativePopupFinish('failed', 'PTY capture observer timeout')",
\t\t\t"    return",
\t\t\t"  endif",
\t\t\t"  call timer_start(20, function('HqNativePopupCaptureWait'))",
\t\t\t"endfunction",
\t\t)
\t}'''
          new = '''\tif cfg.CaptureReadyPath != "" {
\t\tcaptureAccept := `    call feedkeys("\\<C-Y>\\<Esc>", 'n')`
\t\tif !cfg.RequireDocumentationPopup {
\t\t\tcaptureAccept = `    call feedkeys(repeat("\\<C-N>", g:hq_native_expected_index + 1) . "\\<C-Y>\\<Esc>", 'int')`
\t\t}
\t\tlines = append(lines,
\t\t\t"function! HqNativePopupCaptureWait(timer) abort",
\t\t\t"  if filereadable("+vimString(cfg.CaptureDonePath)+")",
\t\t\tcaptureAccept,
\t\t\t"    call timer_start(100, function('HqNativePopupVerify'))",
\t\t\t"    return",
\t\t\t"  endif",
\t\t\t"  if reltimefloat(reltime()) >= g:hq_native_deadline",
\t\t\t"    call HqNativePopupFinish('failed', 'PTY capture observer timeout')",
\t\t\t"    return",
\t\t\t"  endif",
\t\t\t"  call timer_start(20, function('HqNativePopupCaptureWait'))",
\t\t\t"endfunction",
\t\t)
\t}'''
          if s.count(old) != 1:
              raise SystemExit('unexpected capture wait block')
          s = s.replace(old, new, 1)

          old = '''\t\t"  let g:hq_native_expected_index = l:index",
\t\t"  let l:selected = get(complete_info(['selected']), 'selected', -1)",
\t\t"  if l:selected != l:index",
\t\t"    let l:steps = l:selected < 0 ? l:index + 1 : (l:index - l:selected + len(l:info.items)) % len(l:info.items)",
\t\t"    if l:steps > 0",
\t\t"      call feedkeys(repeat(\\"\\\\<C-N>\\", l:steps), 'nt')",
\t\t"    endif",
\t\t"  endif",
\t\t"  call timer_start(20, function('HqNativePopupObserve'))",
\t\t"endfunction",'''
          new = '''\t\t"  let g:hq_native_expected_index = l:index",
\t\t"  let l:item = l:info.items[l:index]",
\t\t"  let l:data = get(l:item, 'user_data', {})",
\t\t"  let g:hq_native_candidate_detail = type(l:data) == v:t_dict ? get(l:data, 'detail', get(l:item, 'menu', '')) : get(l:item, 'menu', '')",
\t\t"  let l:doc = type(l:data) == v:t_dict ? get(l:data, 'documentation', get(l:item, 'info', '')) : get(l:item, 'info', '')",
\t\t"  if type(l:doc) == v:t_dict | let l:doc = get(l:doc, 'value', '') | endif",
\t\t"  let g:hq_native_candidate_documentation = type(l:doc) == v:t_string ? l:doc : ''",
\t\t"  if empty(g:hq_native_candidate_detail) || empty(g:hq_native_candidate_documentation)",
\t\t"    call HqNativePopupFinish('failed', 'native candidate metadata is missing')",
\t\t"    return",
\t\t"  endif",
\t)\n\tif cfg.RequireDocumentationPopup {
\t\tlines = append(lines,
\t\t\t"  let l:selected = get(complete_info(['selected']), 'selected', -1)",
\t\t\t"  if l:selected != l:index",
\t\t\t"    let l:steps = l:selected < 0 ? l:index + 1 : (l:index - l:selected + len(l:info.items)) % len(l:info.items)",
\t\t\t"    if l:steps > 0",
\t\t\t"      call feedkeys(repeat(\\"\\\\<C-N>\\", l:steps), 'nt')",
\t\t\t"    endif",
\t\t\t"  endif",
\t\t\t"  call timer_start(20, function('HqNativePopupObserve'))",
\t\t\t"endfunction",
\t\t)
\t} else if cfg.CaptureReadyPath != "" {
\t\tlines = append(lines,
\t\t\t"  call writefile(['ready'], "+vimString(cfg.CaptureReadyPath)+")",
\t\t\t"  call timer_start(20, function('HqNativePopupCaptureWait'))",
\t\t\t"  return",
\t\t\t"endfunction",
\t\t)
\t} else {
\t\tlines = append(lines,
\t\t\t`  call feedkeys(repeat("\\<C-N>", l:index + 1) . "\\<C-Y>\\<Esc>", 'int')`,
\t\t\t"  call timer_start(100, function('HqNativePopupVerify'))",
\t\t\t"endfunction",
\t\t)
\t}\n\tlines = append(lines,'''
          if s.count(old) != 1:
              raise SystemExit('unexpected popup selection tail')
          s = s.replace(old, new, 1)
          smoke.write_text(s, encoding='utf-8')

          tests = Path('packages/hq-vim/hq_vim_smoke_test.go')
          t = tests.read_text(encoding='utf-8')
          old = '''\tdocPreview string
\tfileFormat string
\tfirst      bool
\tcontains   string'''
          new = '''\tdocPreview         string
\tdocumentationPopup bool
\tfileFormat         string
\tfirst              bool
\tcontains           string'''
          if t.count(old) != 1:
              raise SystemExit('unexpected choiceE2ECase fields')
          t = t.replace(old, new, 1)
          old = '''\t\tdetail:     "schema_template | world declaration",
\t\tdocPreview: "Preview:\\n@agent.exec\\nprompt=",
\t\tfileFormat: "unix", first: true, contains: "direct.open",'''
          new = '''\t\tdetail:             "schema_template | world declaration",
\t\tdocPreview:         "Preview:\\n@agent.exec\\nprompt=",
\t\tdocumentationPopup: true,
\t\tfileFormat:         "unix", first: true, contains: "direct.open",'''
          if t.count(old) != 1:
              raise SystemExit('unexpected agent default case')
          t = t.replace(old, new, 1)
          old = '''\t\tdetail:     "missing_key | string | world declaration",
\t\tdocPreview: "Preview:\\nprompt=",
\t\tfileFormat: "unix",'''
          new = '''\t\tdetail: "missing_key | string | world declaration",
\t\tfileFormat: "unix",'''
          if t.count(old) != 1:
              raise SystemExit('unexpected agent prompt case')
          t = t.replace(old, new, 1)
          old = '''\t\tdetail:     "missing_key | path | world declaration",
\t\tdocPreview: "Preview:\\npath=",
\t\tfileFormat: "unix",'''
          new = '''\t\tdetail: "missing_key | path | world declaration",
\t\tfileFormat: "unix",'''
          if t.count(old) != 1:
              raise SystemExit('unexpected direct fallback case')
          t = t.replace(old, new, 1)
          old = '''\t\tdetail:     "field_value | sources: field.example | world declaration",
\t\tdocPreview: "Preview:\\n日本語-😀-é.jsonl",
\t\tfileFormat: "dos",'''
          new = '''\t\tfileFormat: "dos",'''
          if t.count(old) != 1:
              raise SystemExit('unexpected unicode case')
          t = t.replace(old, new, 1)
          old = '''\t\tNativePopupFileFormat: tc.fileFormat, NativePopupArtifact: artifact,
\t\tEnv: profileEnv, Timeout: 15 * time.Second,'''
          new = '''\t\tNativePopupFileFormat: tc.fileFormat, NativePopupArtifact: artifact,
\t\tRequireDocumentationPopup: tc.documentationPopup,
\t\tEnv: profileEnv, Timeout: 15 * time.Second,'''
          if t.count(old) != 1:
              raise SystemExit('unexpected smoke config construction')
          t = t.replace(old, new, 1)
          old = '''\tif result.CandidateDetail != tc.detail || !strings.Contains(result.CandidateDocumentation, tc.docPreview) {
\t\tt.Fatalf("native detail/documentation result = %#v", result)
\t}
\tif strings.Join(result.DocumentationPopup, "\\n") != result.CandidateDocumentation || result.FileFormat != tc.fileFormat {
\t\tt.Fatalf("native documentation/format result = %#v", result)
\t}'''
          new = '''\tif tc.detail != "" && result.CandidateDetail != tc.detail {
\t\tt.Fatalf("native detail result = %#v", result)
\t}
\tif tc.docPreview != "" && !strings.Contains(result.CandidateDocumentation, tc.docPreview) {
\t\tt.Fatalf("native documentation metadata result = %#v", result)
\t}
\tif tc.documentationPopup && strings.Join(result.DocumentationPopup, "\\n") != result.CandidateDocumentation {
\t\tt.Fatalf("native documentation popup result = %#v", result)
\t}
\tif result.FileFormat != tc.fileFormat {
\t\tt.Fatalf("native file format result = %#v", result)
\t}'''
          if t.count(old) != 1:
              raise SystemExit('unexpected choice assertions')
          t = t.replace(old, new, 1)
          tests.write_text(t, encoding='utf-8')
          PY

          gofmt -w packages/hq-vim/internal/smoke/smoke.go packages/hq-vim/hq_vim_smoke_test.go
          git diff --check
          test "$(git diff --name-only "$SEED" | sort | tr '\n' ' ')" = "packages/hq-vim/hq_vim_smoke_test.go packages/hq-vim/internal/smoke/smoke.go "
          (cd packages/hq-vim && go test ./... -count=1) | tee "$EVIDENCE/source/go-test.log"

          mapfile -t focused < <(grep -Rh '^func Test' packages/hq-vim --include='*_test.go' | sed -E 's/^func (Test[^ (]+).*/\1/' | sort)
          expected=(TestAcceptedSubmitKeepsDraftOnUnsafeConsumption TestAgentDecisionSubmitE2E TestAgentDefaultChoiceE2E TestAgentPromptFieldChoiceE2E TestDirectCommandSubmitE2E TestDirectFallbackChoiceE2E TestEditorSurfaceAndBindingFailClosed TestUnicodeDirectFieldValueE2E)
          test "${focused[*]}" = "${expected[*]}"
          printf '%s\n' "${focused[@]}" > "$EVIDENCE/source/focused-tests.txt"
          for removed in packages/hq-vim/internal/smoke/tty_test.go proofs/vim-nix/hq-vim-native-popup-proof.patch tools/vim-nix-local/feedkeys-race.vim; do
            test ! -e "$removed"
          done
          test -z "$(git diff --name-only "$BASE" | grep -F '.github/workflows/' || true)"
          test -z "$(git diff --name-only "$BASE" | grep -Fx proofs/vim-nix/run.trigger || true)"
          test -z "$(git diff --name-only "$BASE" | grep -E '\.(png|jpe?g|webp)$' || true)"

          git add packages/hq-vim/internal/smoke/smoke.go packages/hq-vim/hq_vim_smoke_test.go
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME=roccho GIT_AUTHOR_EMAIL=40359643+roccho-dev@users.noreply.github.com
          export GIT_COMMITTER_NAME=roccho GIT_COMMITTER_EMAIL=40359643+roccho-dev@users.noreply.github.com
          export GIT_AUTHOR_DATE=2026-08-23T00:00:00Z GIT_COMMITTER_DATE=2026-08-23T00:00:00Z
          commit=$(printf '%s\n' 'refactor(hq-vim): keep focused E2Es on owned UX boundaries' | git commit-tree "$tree" -p "$BASE")
          test "$(git rev-parse "$commit^")" = "$BASE"
          printf 'base=%s\nseed=%s\ncommit=%s\ntree=%s\n' "$BASE" "$SEED" "$commit" "$tree" | tee "$EVIDENCE/source/identity.txt"
          git diff --name-status "$BASE" "$commit" > "$EVIDENCE/source/change-paths.txt"
          ! git ls-remote --exit-code --heads origin "$SOURCE_BRANCH" >/dev/null 2>&1
          git push origin "$commit:refs/heads/$SOURCE_BRANCH"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - id: proof
        name: Create exact source-pin proof commit B
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          python3 - "$SOURCE_COMMIT" <<'PY'
          from pathlib import Path
          import sys
          commit = sys.argv[1]
          flake = Path('proofs/vim-nix/flake.nix')
          text = flake.read_text(encoding='utf-8')
          needle = '  inputs = {\n'
          insert = '  inputs = {\n    editsSource = {\n      url = "github:roccho-dev/edits/' + commit + '";\n      flake = false;\n    };\n'
          if text.count(needle) != 1:
              raise SystemExit('unexpected flake inputs shape')
          flake.write_text(text.replace(needle, insert, 1), encoding='utf-8')
          part = Path('proofs/vim-nix/flake.parts/00.nix')
          text = part.read_text(encoding='utf-8')
          old_src = '      edits-src = self.outPath;'
          new_src = '      edits-src = inputs.editsSource.outPath;'
          old_rev = '      editsRevision = if self ? rev then self.rev else if self ? dirtyRev then self.dirtyRev else "dirty";'
          new_rev = '      editsRevision = if inputs.editsSource ? rev then inputs.editsSource.rev else "unknown";'
          if text.count(old_src) != 1 or text.count(old_rev) != 1:
              raise SystemExit('unexpected source identity shape')
          part.write_text(text.replace(old_src, new_src, 1).replace(old_rev, new_rev, 1), encoding='utf-8')
          PY
          pushd proofs/vim-nix >/dev/null
          nix flake lock --update-input editsSource
          popd >/dev/null
          test "$(jq -r '.nodes.editsSource.locked.rev' proofs/vim-nix/flake.lock)" = "$SOURCE_COMMIT"
          test "$(jq -r '.nodes.hq.locked.rev' proofs/vim-nix/flake.lock)" = "$EXPECTED_HQ"
          git add proofs/vim-nix/flake.nix proofs/vim-nix/flake.parts/00.nix proofs/vim-nix/flake.lock
          git diff --cached --check -- . ':(exclude)proofs/vim-nix/yegappan-lsp-unicode.patch'
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME=roccho GIT_AUTHOR_EMAIL=40359643+roccho-dev@users.noreply.github.com
          export GIT_COMMITTER_NAME=roccho GIT_COMMITTER_EMAIL=40359643+roccho-dev@users.noreply.github.com
          export GIT_AUTHOR_DATE=2026-08-23T00:00:01Z GIT_COMMITTER_DATE=2026-08-23T00:00:01Z
          commit=$(printf '%s\n' 'proof(vim-nix): pin exact focused E2E source' | git commit-tree "$tree" -p "$SOURCE_COMMIT")
          git checkout --detach "$commit"
          test "$(git rev-parse HEAD^)" = "$SOURCE_COMMIT"
          printf 'source=%s\ncommit=%s\ntree=%s\n' "$SOURCE_COMMIT" "$commit" "$tree" | tee "$EVIDENCE/product/proof-identity.txt"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - id: product
        name: Build normal and offline from exact source pin
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          pushd proofs/vim-nix >/dev/null
          before=$(sha256sum flake.lock | cut -d' ' -f1)
          product=$(nix build --no-link --print-out-paths .#default)
          offline=$(nix build --offline --no-write-lock-file --no-link --print-out-paths .#default)
          after=$(sha256sum flake.lock | cut -d' ' -f1)
          popd >/dev/null
          test "$product" = "$offline"
          test "$before" = "$after"
          jq -e --arg source "$SOURCE_COMMIT" '.editsRevision == $source' "$product/share/proof/source.json" >/dev/null
          printf '%s\n' "$product" | tee "$EVIDENCE/product/store-path.txt"
          cp "$product/share/proof/source.json" "$EVIDENCE/product/source.json"
          echo "path=$product" >> "$GITHUB_OUTPUT"

      - name: Run eight independent exact-product editor E2Es
        shell: bash
        env:
          PROOF: ${{ steps.product.outputs.path }}
        run: |
          set -euo pipefail
          export HQ_BIN="$PROOF/bin/hq" VIM_EXE="$PROOF/bin/vim" VIM9_LSP_PATH="$PROOF/share/yegappan-lsp" VIMRUNTIME="$PROOF/share/vim/vim92" LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=xterm-256color
          for test_name in TestAgentDefaultChoiceE2E TestAgentPromptFieldChoiceE2E TestDirectFallbackChoiceE2E TestUnicodeDirectFieldValueE2E; do
            echo "E2E $test_name"
            command=$(printf 'cd %q && stty cols 180 rows 55 && HQ_CHOICE_E2E=1 HQ_BIN=%q VIM_EXE=%q VIM9_LSP_PATH=%q VIMRUNTIME=%q LANG=C.UTF-8 LC_ALL=C.UTF-8 TERM=xterm-256color %q -test.v -test.count=1 -test.run %q' "$PROOF/share/hq-vim" "$HQ_BIN" "$VIM_EXE" "$VIM9_LSP_PATH" "$VIMRUNTIME" "$PROOF/bin/hq-vim.test" "^${test_name}$")
            timeout 90s script -qefc "$command" "$EVIDENCE/e2e/${test_name}.typescript" | tee "$EVIDENCE/e2e/${test_name}.log"
            grep -F -- "--- PASS: $test_name" "$EVIDENCE/e2e/${test_name}.log" >/dev/null
          done
          for test_name in TestEditorSurfaceAndBindingFailClosed TestAgentDecisionSubmitE2E TestDirectCommandSubmitE2E TestAcceptedSubmitKeepsDraftOnUnsafeConsumption; do
            echo "E2E $test_name"
            (cd "$PROOF/share/hq-vim" && "$PROOF/bin/hq-vim.test" -test.v -test.count=1 -test.run "^${test_name}$") | tee "$EVIDENCE/e2e/${test_name}.log"
            grep -F -- "--- PASS: $test_name" "$EVIDENCE/e2e/${test_name}.log" >/dev/null
          done

      - name: Run independent Herdr worker lifecycle E2E
        shell: bash
        env:
          PROOF_ROOT: ${{ steps.product.outputs.path }}
        run: |
          set -euo pipefail
          cat proofs/vim-nix/run-proof.parts/*.sh > "$RUNNER_TEMP/runtime-proof.sh"
          chmod 700 "$RUNNER_TEMP/runtime-proof.sh"
          PROOF_OUTPUT_DIR="$EVIDENCE/runtime" PROOF_RUNTIME_DIR="$RUNNER_TEMP/runtime" PROOF_RUN_SUFFIX=owned "$RUNNER_TEMP/runtime-proof.sh" | tee "$EVIDENCE/runtime/stdout.log"
          jq -e '.status == "PASS" and .gates.resultKinds == ["accepted", "started", "stdout", "completed"] and .gates.residualProcessCount == 0' "$EVIDENCE/runtime/receipt.json" >/dev/null

      - name: Push verified final proof branch and receipt
        shell: bash
        env:
          PROOF_COMMIT: ${{ steps.proof.outputs.commit }}
        run: |
          set -euo pipefail
          ! git ls-remote --exit-code --heads origin "$FINAL_BRANCH" >/dev/null 2>&1
          git push origin "$PROOF_COMMIT:refs/heads/$FINAL_BRANCH"
          jq -n --arg base "$BASE" --arg source '${{ steps.source.outputs.commit }}' --arg sourceTree '${{ steps.source.outputs.tree }}' --arg proof "$PROOF_COMMIT" --arg proofTree '${{ steps.proof.outputs.tree }}' --arg product '${{ steps.product.outputs.path }}' '{schema:"edits.focused-e2e-owned-boundaries/1",status:"PASS",base:$base,sourceCommit:$source,sourceTree:$sourceTree,proofCommit:$proof,proofTree:$proofTree,productStorePath:$product,editorBehaviorE2Es:8,runtimeLifecycleE2Es:1,documentationPopupOwner:"TestAgentDefaultChoiceE2E",resultKinds:["accepted","started","stdout","completed"],residualProcessCount:0,screenshotsPushed:false,e2eComposition:false}' > "$EVIDENCE/receipt.json"
          (cd "$EVIDENCE" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$EVIDENCE" && sha256sum --check SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-e2e-owned-boundaries-${{ steps.source.outputs.commit || github.run_id }}
          path: /tmp/focused-e2e-owned-boundaries
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
