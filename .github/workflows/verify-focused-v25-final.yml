name: verify strict v25 distribution

on:
  push:
    branches:
      - automation/verify-focused-v25-final-20260824
    paths:
      - proofs/verify-focused-v25-final.trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      STRICT: 3069e3dc4a1f0954ea3109aafcbae812af482af4
      STRICT_TREE: bfecb003947fb020c173ad15f981508230fe025f
      PRODUCT_SOURCE: bfdac8df95ec435ed8aad7042fa1fc9bc1082f6a
      STATUS_BRANCH: status/focused-v25-final-verify-20260824-a
      STATUS_PATH: proofs/v25-strict-distribution.json
      ARTIFACT: /tmp/vim-nix-herdr-oci-proof
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Persist strict run start
        shell: bash
        run: |
          set -euo pipefail
          body=$(jq -cn --arg strict "$STRICT" --arg tree "$STRICT_TREE" --arg source "$PRODUCT_SOURCE" --arg run "$GITHUB_RUN_ID" --arg trigger "$GITHUB_SHA" '{schema:"edits.v25-strict-distribution-status/1",status:"RUNNING",proofCommit:$strict,proofTree:$tree,productSource:$source,runId:($run|tonumber),triggerCommit:$trigger,physicalWindowsWslc:"OPEN",failure:null}')
          encoded=$(printf '%s\n' "$body" | base64 -w0)
          existing=$(gh api "repos/$GITHUB_REPOSITORY/contents/$STATUS_PATH?ref=$STATUS_BRANCH" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_PATH" -f message='proof: record strict v25 distribution run start' -f content="$encoded" -f branch="$STATUS_BRANCH")
          if test -n "$existing"; then args+=(-f sha="$existing"); fi
          gh api "${args[@]}" >/dev/null

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - id: proof
        name: Execute strict v25 distribution closure
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/proof/vim-nix-herdr-oci-current-20260821
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$STRICT"
          git checkout --detach "$STRICT"
          test "$(git rev-parse HEAD^{tree})" = "$STRICT_TREE"
          test -z "$(git status --porcelain=v1)"
          rm -rf "$ARTIFACT"
          cat proofs/vim-nix/ci.parts/*.sh > "$RUNNER_TEMP/vim-nix-strict-ci.sh"
          chmod 0700 "$RUNNER_TEMP/vim-nix-strict-ci.sh"
          GITHUB_SHA="$STRICT" ARTIFACT="$ARTIFACT" "$RUNNER_TEMP/vim-nix-strict-ci.sh"
          jq -e --arg strict "$STRICT" --arg source "$PRODUCT_SOURCE" '
            .status == "DISTRIBUTION_CLOSURE_PASS" and
            .proofCommit == $strict and
            .productSource == $source and
            .physicalWindowsWslc == "OPEN" and
            .issue74Complete == false and
            (.gates | to_entries | all(.value == "PASS"))
          ' "$ARTIFACT/ci-receipt.json" >/dev/null
          echo "distribution=DISTRIBUTION_CLOSURE_PASS" >> "$GITHUB_OUTPUT"

      - name: Normalize artifact ownership
        if: always()
        shell: bash
        run: |
          if test -e "$ARTIFACT"; then
            sudo chown -R "$(id -u):$(id -g)" "$ARTIFACT" || true
          fi

      - name: Persist strict verification result
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.proof.outcome }}
        run: |
          set -euo pipefail
          status=FAIL
          test "$OUTCOME" = success && status=DISTRIBUTION_CLOSURE_PASS

          failurePhase=""
          failureCommand=""
          failureExitCode=""
          if test -f "$ARTIFACT/strict-failure.json"; then
            failurePhase=$(jq -r '.phase // ""' "$ARTIFACT/strict-failure.json")
            failureCommand=$(jq -r '.command // ""' "$ARTIFACT/strict-failure.json")
            failureExitCode=$(jq -r '.exitCode // "" | tostring' "$ARTIFACT/strict-failure.json")
          fi

          errorTail=$(tail -c 8000 "$ARTIFACT/product/clean-store-import.stderr" 2>/dev/null || true)
          if test -z "$errorTail"; then
            errorTail=$(tail -c 8000 "$ARTIFACT/product/clean-offline-build.stderr" 2>/dev/null || true)
          fi

          body=$(jq -cn \
            --arg status "$status" \
            --arg strict "$STRICT" \
            --arg tree "$STRICT_TREE" \
            --arg source "$PRODUCT_SOURCE" \
            --arg run "$GITHUB_RUN_ID" \
            --arg trigger "$GITHUB_SHA" \
            --arg failurePhase "$failurePhase" \
            --arg failureCommand "$failureCommand" \
            --arg failureExitCode "$failureExitCode" \
            --arg errorTail "$errorTail" \
            '{
              schema:"edits.v25-strict-distribution-status/1",
              status:$status,
              proofCommit:$strict,
              proofTree:$tree,
              productSource:$source,
              runId:($run|tonumber),
              triggerCommit:$trigger,
              physicalWindowsWslc:"OPEN",
              failure:(if $status == "FAIL" then {
                phase:$failurePhase,
                command:$failureCommand,
                exitCode:(if $failureExitCode == "" then null else ($failureExitCode|tonumber) end),
                errorTail:$errorTail
              } else null end)
            }')
          encoded=$(printf '%s\n' "$body" | base64 -w0)
          existing=$(gh api "repos/$GITHUB_REPOSITORY/contents/$STATUS_PATH?ref=$STATUS_BRANCH" --jq .sha 2>/dev/null || true)
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_PATH" -f message='proof: record strict v25 distribution verification' -f content="$encoded" -f branch="$STATUS_BRANCH")
          if test -n "$existing"; then args+=(-f sha="$existing"); fi
          gh api "${args[@]}" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-v25-diagnostic-${{ github.run_id }}
          path: |
            /tmp/vim-nix-herdr-oci-proof/strict-failure.json
            /tmp/vim-nix-herdr-oci-proof/product/clean-store-import.stdout
            /tmp/vim-nix-herdr-oci-proof/product/clean-store-import.stderr
            /tmp/vim-nix-herdr-oci-proof/product/clean-offline-build.stdout
            /tmp/vim-nix-herdr-oci-proof/product/clean-offline-build.stderr
            /tmp/vim-nix-herdr-oci-proof/clean-offline-replay.receipt.json
            /tmp/vim-nix-herdr-oci-proof/ci-receipt.json
          compression-level: 9
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-v25-distribution-${{ github.run_id }}
          path: /tmp/vim-nix-herdr-oci-proof
          compression-level: 0
          retention-days: 90
          if-no-files-found: warn
