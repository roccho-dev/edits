name: watch focused E2E helper repair

on:
  push:
    branches:
      - automation/watch-focused-e2e-20260822

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: automation/repair-focused-e2e-20260822
      TARGET_HEAD: 30a7f3273ceea4994f902d33afa21b7f36ec1b9a
      TARGET_WORKFLOW: repair-focused-e2e.yml
      TARGET_PR: "100"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read back helper repair conclusion
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "$TARGET_WORKFLOW" \
              --branch "$TARGET_BRANCH" \
              --limit 20 \
              --json databaseId,status,conclusion,headSha,event,url,createdAt)
            row=$(printf '%s' "$runs" | jq -c --arg head "$TARGET_HEAD" \
              '[.[] | select(.headSha == $head)] | sort_by(.databaseId) | last // empty')
            if test -n "$row" && test "$(printf '%s' "$row" | jq -r .status)" = completed; then
              id=$(printf '%s' "$row" | jq -r .databaseId)
              conclusion=$(printf '%s' "$row" | jq -r .conclusion)
              url=$(printf '%s' "$row" | jq -r .url)
              gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body \
                "Focused E2E helper repair readback: run \`$id\`, conclusion \`$conclusion\`, head \`$TARGET_HEAD\`. $url"
              test "$conclusion" = success
              exit 0
            fi
            sleep 10
          done
          gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body \
            "Focused E2E helper repair readback timed out for head \`$TARGET_HEAD\`; no success is claimed."
          exit 1
