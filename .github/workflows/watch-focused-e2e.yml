name: inspect focused E2E runs

on:
  push:
    branches:
      - automation/watch-focused-e2e-20260822

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: automation/focused-e2e-screenshot-refactor-20260822
      TARGET_HEAD: f318036ff217557f2c7af37b29197f6624ae72fa
      TARGET_WORKFLOW: integrate-focused-e2e-screenshot.yml
      TARGET_PR: "100"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report all exact-head runs
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow "$TARGET_WORKFLOW" \
            --branch "$TARGET_BRANCH" \
            --limit 30 \
            --json databaseId,status,conclusion,headSha,event,url,createdAt)
          rows=$(printf '%s' "$runs" | jq -c --arg head "$TARGET_HEAD" '[.[] | select(.headSha == $head)] | sort_by(.databaseId)')
          count=$(printf '%s' "$rows" | jq length)
          table=$(printf '%s' "$rows" | jq -r '.[] | "- run `\(.databaseId)`: event=`\(.event)`, status=`\(.status)`, conclusion=`\(.conclusion // "")`, \(.url)"')
          gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body \
            "Exact-head focused E2E run inventory for \`$TARGET_HEAD\` (count \`$count\`):\n\n$table"
          test "$count" -gt 0
